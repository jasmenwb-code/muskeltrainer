:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: eine ruhige Spalte im Stil gruppierter iOS-Listen; System-Schrift, viel Weißraum, ein Akzent */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --fill:#F2F2F7; --fill-2:#E9E9EE; --ink:#1C1C1E; --muted:#6E6E73; --sep:#E3E3E8;
  --accent:#D93A2B; --accent-ink:#FFFFFF; --accent-soft:#FBE7E4;
  --ok:#1F8A3A; --ok-soft:#E3F4E7; --warn:#B25000; --warn-soft:#FDF0E0;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --fill:#2C2C2E; --fill-2:#3A3A3C; --ink:#F5F5F7; --muted:#98989F; --sep:#38383A;
  --accent:#FF6B5E; --accent-ink:#1A0806; --accent-soft:#3A1C18;
  --ok:#3DD269; --ok-soft:#12301B; --warn:#FFA43A; --warn-soft:#33240E;
  --shadow:none; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --fill:#2C2C2E; --fill-2:#3A3A3C; --ink:#F5F5F7; --muted:#98989F; --sep:#38383A;
  --accent:#FF6B5E; --accent-ink:#1A0806; --accent-soft:#3A1C18;
  --ok:#3DD269; --ok-soft:#12301B; --warn:#FFA43A; --warn-soft:#33240E;
  --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-block:8px 48px;display:flex;flex-direction:column;gap:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.stack-sm{display:flex;flex-direction:column;gap:10px}

/* Kopfzeile: Zurück links, Name mittig, Einstellungen rechts */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:52px}
.bar .left{justify-self:start;min-width:0}
.bar .right{justify-self:end;display:flex;gap:8px}
.brand{font-size:22px;font-weight:800;letter-spacing:-.025em;margin:0;white-space:nowrap;background:none;border:0;padding:4px 2px;color:var(--ink);cursor:pointer}
.navback{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);color:var(--accent);display:grid;place-items:center}
.navback span{display:none}
.navback svg{width:20px;height:20px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);color:var(--muted);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
@media (max-width:360px){ .brand{font-size:19px} }

/* Typo */
.pagetitle{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.025em;margin:4px 0 0;text-align:center;text-wrap:balance}
.large{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.03em;margin:4px 0 0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:15px}
.title-xl{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.title-xl small{font-size:.62em;font-weight:600;color:var(--muted);margin-right:.25em;letter-spacing:0}
.question{font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
.group-label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 -12px 16px}
.footnote{font-size:13px;color:var(--muted);margin:0;text-align:center}
.hint{font-size:14px;color:var(--muted);margin:0;min-height:1em}
.hint:empty{display:none}
.hint.warn{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px}
.pill.neutral{color:var(--muted);background:var(--fill)}

/* Gruppierte Listen */
.group{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:10px 16px;background:none;border:0;text-align:left;position:relative}
.row + .row,.row + .sublist,.sublist + .row{box-shadow:inset 0 .5px 0 var(--sep)}
.row .label{flex:1;min-width:0;display:flex;flex-direction:column}
.row .label small{font-size:13px;color:var(--muted)}
.row .value{color:var(--muted);font-size:17px;white-space:nowrap}
.chev{width:16px;height:16px;color:#C4C4C9;flex:none;transition:transform .2s ease}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sublist{background:var(--surface)}
.sublist .row{padding-left:32px;min-height:46px}
.check{width:20px;height:20px;color:var(--accent);flex:none;opacity:0}
.row[aria-checked="true"] .check{opacity:1}
.count{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.sublist .tools{display:flex;gap:18px;padding:10px 16px 12px 32px;box-shadow:inset 0 .5px 0 var(--sep)}
.link{background:none;border:0;color:var(--accent);padding:4px 0;font-size:15px}
.tile{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--accent);color:#fff}
.tile svg{width:18px;height:18px}

/* Schalter */
.switch{position:relative;width:51px;height:31px;border-radius:999px;background:var(--fill-2);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .2s}
.row[aria-checked="true"] .switch{background:var(--ok)}
.row[aria-checked="true"] .switch::after{transform:translateX(20px)}

/* Segmente */
.seg{display:flex;background:var(--fill-2);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 8px;font-size:15px;font-weight:500;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;min-height:50px;padding:12px 18px;font-size:17px;font-weight:600;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.tinted{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.btn.small{min-height:36px;padding:6px 14px;font-size:15px;width:auto;border-radius:999px}
.card > .btn.small{align-self:flex-start}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btnrow{display:flex;gap:10px}
.btnrow > *{flex:1}

/* Karten */
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{flex:1;height:4px;border-radius:4px;background:var(--fill-2);overflow:hidden}
.track span{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s ease}
.steps{display:flex;gap:6px}
.step{flex:1;min-width:0;text-align:center;font-size:12px;font-weight:600;padding:6px 2px;border-radius:8px;background:var(--fill);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.cur{background:var(--ink);color:var(--surface)}
.step.good{background:var(--ok-soft);color:var(--ok)}
.step.part{background:var(--warn-soft);color:var(--warn)}
.step.bad{background:var(--accent-soft);color:var(--accent)}

/* Eingabe */
.answerbox{position:relative}
textarea,.field{width:100%;border:0;border-radius:var(--r);background:var(--surface);color:var(--ink);font:inherit;box-shadow:var(--shadow)}
textarea{min-height:130px;resize:vertical;padding:14px 66px 14px 16px;display:block}
textarea:disabled{opacity:.6}
.field{padding:13px 16px;min-height:50px}
.field::placeholder,textarea::placeholder{color:#A1A1A6}
.mic{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mic svg{width:22px;height:22px}
.mic.on{background:var(--accent);color:var(--accent-ink);animation:pulse 1.2s ease-in-out infinite}
.mic:disabled{opacity:.4}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--accent-soft)}}
.srlabel{position:absolute;left:-9999px}

/* Ergebnis */
.verdict{display:flex;align-items:center;gap:12px}
.vicon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.vicon svg{width:22px;height:22px}
.v-good .vicon{background:var(--ok-soft);color:var(--ok)}
.v-part .vicon{background:var(--warn-soft);color:var(--warn)}
.v-bad .vicon{background:var(--accent-soft);color:var(--accent)}
.verdict b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.verdict span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.yours{margin:0;padding:12px 14px;background:var(--fill);border-radius:var(--r-sm);color:var(--muted);overflow-wrap:anywhere}
.sol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.sol li{padding-left:16px;position:relative}
.sol li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.sol li.note{color:var(--muted);font-size:15px}
.sol li.note::before{background:var(--sep)}
.sol b{font-weight:600}
.k{border-radius:4px;padding:0 2px}
.k.hit{background:var(--ok-soft);color:var(--ok)}
.k.miss{background:var(--warn-soft);color:var(--warn)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:0;margin-right:5px}
.explain{background:var(--fill);border-radius:var(--r-sm);padding:14px;white-space:pre-wrap;font-size:16px}
.explain .t{display:block;font-weight:600;font-size:13px;color:var(--accent);margin-bottom:4px;white-space:normal}
.sectionhead{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0}
.fig{margin:0;display:flex;flex-direction:column;gap:6px}
.figbtn{border:0;border-radius:var(--r-sm);background:#FFFFFF;padding:10px;display:flex;justify-content:center}
.figbtn img{display:block;max-width:100%;max-height:340px;width:auto;height:auto;object-fit:contain}
.fig.big .figbtn img{max-height:none;width:100%}
.fig figcaption{font-size:13px;color:var(--muted)}

/* Multiple Choice */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1.5px solid transparent;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:12px 14px;font-size:15px;line-height:1.35;color:var(--ink);transition:transform .08s ease,background .15s}
.card .opt{background:var(--fill);box-shadow:none}
.opt:not(:disabled):active{transform:scale(.985)}
.opt:not(:disabled):hover{border-color:var(--sep)}
.optl{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--fill-2);color:var(--muted)}
.card .opt .optl{background:var(--surface)}
.optt{flex:1;min-width:0;overflow-wrap:anywhere}
.opttag{flex:none;align-self:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--ink)}
.opt:disabled{cursor:default}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .optl{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .optl{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong .optl{background:var(--accent);color:var(--accent-ink)}
.opt.dim{opacity:.55}

/* Listen am Ende */
.list .row{min-height:56px}
.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;background:var(--fill);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.good{background:var(--ok-soft);color:var(--ok)} .badge.part{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--accent-soft);color:var(--accent)}

/* Muskelsuche */
.search{padding:10px 12px 12px;box-shadow:inset 0 .5px 0 var(--sep)}
.search .field{box-shadow:none;background:var(--fill);min-height:40px;padding:8px 12px;border-radius:10px;font-size:16px}
.mgroup{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:12px 16px 4px 32px;box-shadow:inset 0 .5px 0 var(--sep)}
.muscles{max-height:420px;overflow-y:auto}

/* Duell */
.online{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.online.busy{background:var(--warn)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow)}
.sc{display:flex;flex-direction:column;min-width:0}
.sc small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc b{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sc.me b{color:var(--accent)}
.sc.op{text-align:right}
.sc.mid{font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.tbar{height:6px;background:var(--fill-2);border-radius:6px;overflow:hidden}
.tbar span{display:block;height:100%;width:100%;background:var(--ok);transition:width .2s linear}
.tbar span.low{background:var(--accent)}
.opp{margin:0;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:8px}
.opp i{width:8px;height:8px;border-radius:50%;background:var(--warn);animation:blink 1.4s ease-in-out infinite}
.opp i.done{background:var(--ok);animation:none}
@keyframes blink{50%{opacity:.3}}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.duo{grid-template-columns:1fr}}
.pv{border-radius:var(--r-sm);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--fill)}
.pv.ok{background:var(--ok-soft)} .pv.no{background:var(--accent-soft)}
.pvh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pvh small{font-size:13px;color:var(--muted);flex-basis:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvh b{font-size:20px;font-weight:700;line-height:1.1}
.pv.ok b{color:var(--ok)} .pv.no b{color:var(--accent)}
.pvh span{font-size:14px;font-variant-numeric:tabular-nums}
.pv p{margin:0;font-size:15px;overflow-wrap:anywhere}
.pv .tm{font-size:12px;color:var(--muted)}
.codebig{font-size:56px;font-weight:700;letter-spacing:.14em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;text-align:center}
.center{text-align:center;align-items:center}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--fill-2);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.coderow{display:flex;gap:10px}
.coderow .field{flex:1;min-width:0;letter-spacing:.2em;font-variant-numeric:tabular-nums}
.coderow .btn{width:auto;flex:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);
  padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet-in p{margin:0;font-size:17px}

@media (prefers-reduced-motion: reduce){ .mic.on,.spinner,.opp i{animation:none} .chev,.switch,.switch::after,.track span{transition:none} }

/* Einzelfragen */
.qcard{gap:10px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.fact{font-size:22px;line-height:1.3;font-weight:650;letter-spacing:-.015em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
details.more{padding:0;gap:0}
details.more > summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:600;color:var(--accent);display:flex;justify-content:space-between;align-items:center}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-left:12px;transition:transform .2s}
details.more[open] > summary::after{transform:rotate(-135deg)}
details.more > *:not(summary){margin:0 18px 14px}

/* Freunde & Rangliste */
.online.off{background:var(--fill-2)}
.rowlink{background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer}
.addf{font-size:20px;font-weight:600;color:var(--accent);background:var(--accent-soft)}
.fcode{font-size:22px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.rank{width:28px;flex:none;text-align:center;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.me-row{background:var(--accent-soft)}
.value b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Profilbilder */
.avatar{position:relative;flex:none;width:36px;height:36px;border-radius:50%;display:inline-block}
.avatar img,.avatar span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;object-fit:cover;color:#fff;font-weight:700;font-size:14px;letter-spacing:.02em}
.avatar.xl{width:96px;height:96px}
.avatar.xl span{font-size:34px}
.avatar .st{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface);background:var(--fill-2)}
.avatar .st.on{background:var(--ok)} .avatar .st.busy{background:var(--warn)}
.avatarbtn{padding:0;overflow:hidden}

const STOP=new Set('der die das des dem den ein eine einer eines einem und oder sowie sowohl auch als am an im in ins von vom zur zum zu bei mit bis ueber auf aus nach dabei daher gleicher gleiche teilweise gelegentlich jeweils gesamter gesamte muskel alle aller saemtlicher teil entspringen inserieren verlaufen verlaeuft ausnahme proc procc lig musculus musculi nervus nervi processus ligamentum ramus rami ihr ihrer seines seiner sich ist wird the'.split(' '));
function lowerDe(s){return s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'')}
function mapTok(t){
  if(NUMW[t]) return NUMW[t];
  for(const st in ORD){ if(t.startsWith(st) && ENDS.includes(t.slice(st.length))) return ORD[st]; }
  if(ROM[t]) return ROM[t];
  if(/^t\d/.test(t)) return 'th'+t.slice(1);
  return t;
}
function toks(str){
  const raw=lowerDe(str).split(/[^a-z0-9]+/).filter(Boolean).map(mapTok);
  const out=[];
  for(let i=0;i<raw.length;i++){
    const t=raw[i];
    if(['c','th','t','l','s'].includes(t) && /^\d+$/.test(raw[i+1]||'')){ out.push((t==='t'?'th':t)+raw[i+1]); i++; }
    else out.push(t);
  }
  return out;
}
function keep(t){return !STOP.has(t) && (t.length>=3 || /\d/.test(t))}
function parseItem(s){
  const note=s.startsWith('!'); const body=note?s.slice(1).trim():s;
  const k=body.indexOf(' :: ');
  return {note, label:k>=0?body.slice(0,k):'', text:k>=0?body.slice(k+4):body};
}
function keyString(s){ // Klammern weglassen, außer reinen Segmentangaben wie (C5–7)
  return s.replace(/\(([^()]*)\)/g,(m,inner)=>/^[\sCSLTh\d,–\-]+$/.test(inner)?' '+inner+' ':' ');
}
function keysFor(items){
  const set=new Set();
  items.forEach(raw=>{const it=parseItem(raw); if(it.note) return; toks(keyString(it.label+' '+it.text)).filter(keep).forEach(t=>set.add(t));});
  return [...set];
}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function close(k,a){
  if(k===a) return true;
  if(/\d/.test(k)||/\d/.test(a)) return false;
  const m=Math.min(k.length,a.length); let p=0; while(p<m && k[p]===a[p]) p++;
  if(p===m && m>=3 && Math.abs(k.length-a.length)<=(m>=5?3:1)) return true;
  if(m>=5 && p>=Math.max(5,m-2)) return true;
  if(m>=5 && k.slice(0,3)===a.slice(0,3) && lev(k,a)<=(m>=9?2:1)) return true;
  return false;
}
const SYN=[['kopf',['caput']],['lang',['longum','longus','longi']],['kurz',['breve','brevis','breves']],['schulterblatt',['scapula']],
 ['schluesselbein',['clavicula']],['brustbein',['sternum','sterni']],['oberarmknochen',['humerus']],['oberschenkelknochen',['femur']],
 ['elle',['ulna','ulnae']],['speiche',['radius','radii']],['schienbein',['tibia','tibiae']],['wadenbein',['fibula','fibulae']],
 ['kreuzbein',['sacrum','sacri']],['darmbein',['ilium','iliaca']],['sitzbein',['ischii','ischiadicum']],['schambein',['pubis']],
 ['beug',['flexion']],['streck',['extension']],['hinterhaupt',['occipitale']],['brustwirbel',['bws']],['halswirbel',['hws']],['lendenwirbel',['lws']]];
function grade(items,answer){
  const keys=keysFor(items); const ans=[];
  toks(answer).forEach(t=>{ ans.push(t); for(const [p,syn] of SYN) if(t.startsWith(p)) ans.push(...syn); });
  const hits=new Set(keys.filter(k=>ans.some(a=>close(k,a))));
  return {keys,hits,pct:keys.length?hits.size/keys.length:0};
}


/* ---------- Vorlesen ---------- */
const synth=window.speechSynthesis||null; let deVoice=null, autoRead=false;
function pickVoice(){ if(!synth) return; const v=synth.getVoices(); deVoice=v.find(x=>/^de(-|_)DE/i.test(x.lang))||v.find(x=>/^de/i.test(x.lang))||null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }
function ttsText(s){
  return s.replace(/^!\s*/,'').replace(/\bMm\./g,'Musculi').replace(/\bM\./g,'Musculus').replace(/\bNn\./g,'Nervi').replace(/\bN\./g,'Nervus')
   .replace(/\bProcc\./g,'Processus').replace(/\bProc\./g,'Processus').replace(/\bLig\./g,'Ligamentum').replace(/\bRr\./g,'Rami').replace(/\bR\./g,'Ramus')
   .replace(/\bn\. radialis/g,'nervi radialis').replace(/\bu\./g,'und').replace(/HWS/g,'Halswirbelsäule').replace(/BWS/g,'Brustwirbelsäule').replace(/LWS/g,'Lendenwirbelsäule')
   .replace(/\bTh(\d)/g,'T $1').replace(/\b([CLS])(\d)/g,'$1 $2').replace(/–/g,' bis ').replace(/ :: /g,': ').replace(/[„“]/g,'');
}
function speak(text){
  if(!synth) return; try{ synth.cancel(); const u=new SpeechSynthesisUtterance(ttsText(text)); u.lang='de-DE'; if(deVoice) u.voice=deVoice; u.rate=0.95; synth.speak(u);}catch(e){}
}

/* ---------- Spracheingabe ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null; let rec=null, recOn=false;
function stopRec(){ if(rec){ try{rec.stop()}catch(e){} } recOn=false; const b=document.getElementById('mic'); if(b) b.classList.remove('on'); }
function micHint(msg,warn){ const h=document.getElementById('micHint'); if(h){ h.textContent=msg; h.classList.toggle('warn',!!warn);} }
function toggleMic(){
  const ta=document.getElementById('answer');
  if(recOn){ stopRec(); return; }
  if(!SR){ micHint('Spracheingabe ist in dieser Ansicht nicht verfügbar. Tippe ins Antwortfeld und nutze das Mikrofon deiner Handy-Tastatur zum Diktieren.',true); ta.focus(); return; }
  try{
    if(synth) synth.cancel();
    rec=new SR(); rec.lang='de-DE'; rec.interimResults=true; rec.continuous=true;
    const base=ta.value?ta.value.trim()+' ':'';
    rec.onresult=e=>{ let t=''; for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript; ta.value=base+t; };
    rec.onerror=e=>{ stopRec(); if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture') micHint('Das Mikrofon ist hier blockiert. Tippe ins Antwortfeld und nutze das Mikrofon deiner Handy-Tastatur zum Diktieren.',true); else if(e.error!=='aborted' && e.error!=='no-speech') micHint('Spracheingabe abgebrochen. Tippe nochmal auf das Mikrofon.',true); };
    rec.onend=()=>{ recOn=false; const b=document.getElementById('mic'); if(b) b.classList.remove('on'); };
    rec.start(); recOn=true; document.getElementById('mic').classList.add('on'); micHint('Ich höre zu … tippe auf das Mikrofon, wenn du fertig bist.');
  }catch(e){ stopRec(); micHint('Spracheingabe konnte nicht starten. Nutze das Mikrofon deiner Handy-Tastatur.',true); }
}

const FB_VER='10.12.2';
const FB={app:null,auth:null,db:null,user:null,loading:null,authReady:null};
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.async=true; s.onload=res; s.onerror=()=>rej(new Error('load')); document.head.appendChild(s); }); }
function fbConfigured(){ const c=window.FIREBASE_CONFIG; return !!(c&&c.apiKey&&!/DEIN|YOUR/.test(c.apiKey)&&c.databaseURL); }
async function loadFirebase(){
  if(FB.loading) return FB.loading;
  FB.loading=(async()=>{
    const b='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    await loadScript(b+'firebase-app-compat.js');
    await Promise.all([loadScript(b+'firebase-auth-compat.js'),loadScript(b+'firebase-database-compat.js')]);
    FB.app=firebase.initializeApp(window.FIREBASE_CONFIG);
    FB.auth=firebase.auth(); FB.db=firebase.database();
    FB.authReady=new Promise(res=>{ const off=FB.auth.onAuthStateChanged(u=>{ FB.user=u; res(u); }); });
    FB.auth.onAuthStateChanged(u=>{ FB.user=u; });
    await FB.authReady;
  })();
  FB.loading.catch(()=>{ FB.loading=null; });
  return FB.loading;
}

/* Raum-Adapter: bildet die Lobby und Duell-Räume auf die Realtime Database ab */
function fbRoom(path){
  const uid=FB.user.uid; const ref=FB.db.ref(path); const mine=ref.child(uid);
  let peers=Object.freeze([]); const hs=new Set(), es=new Set(); let cur={}, disc=false, alive=true;
  const cb=s=>{ const v=s.val()||{}; peers=Object.freeze(Object.keys(v).map(k=>Object.freeze({peer:k,by:k,isMe:k===uid,sameTab:k===uid,kind:'viewer',guest:false,presence:v[k]||{},updatedAt:0}))); hs.forEach(h=>{ try{h({peers})}catch(e){console.error(e)} }); };
  ref.on('value',cb,()=>{ es.forEach(e=>e({code:'upstream_error',message:'Verbindung verloren'})); });
  return {
    name:path,
    peers:()=>peers,
    onPeers(h,e){ hs.add(h); if(e) es.add(e); setTimeout(()=>{ if(alive&&hs.has(h)) h({peers}); },0); return ()=>{ hs.delete(h); if(e) es.delete(e); }; },
    presence(patch){
      if(!alive) return Promise.resolve();
      const n={...cur}; for(const k in patch){ if(patch[k]===null||patch[k]===undefined) delete n[k]; else n[k]=JSON.parse(JSON.stringify(patch[k])); }
      cur=n; if(!disc){ disc=true; mine.onDisconnect().remove(); }
      return mine.set(cur);
    },
    leave(){ alive=false; ref.off('value',cb); hs.clear(); es.clear(); mine.onDisconnect().cancel(); return mine.remove(); },
    join(name){ return Promise.resolve(fbRoom('rooms/'+name)); },
    connected:()=>true
  };
}

/* ---------- Kurze Einzelfragen (4 Antworten, genau eine richtig) ---------- */
const QF=['U','A','F','I'];
const NOPT=4;
const MV='flexion extension abduktion adduktion innenrotation aussenrotation pronation supination anteversion retroversion dorsalextension plantarflexion palmarflexion inversion eversion lateralflexion rotation elevation inspiration exspiration spreizen opposition radialabduktion ulnarabduktion semipronation'.split(' ');
function realItems(m,k){ return (m[k]||[]).map((s,i)=>Object.assign({i},parseItem(s))).filter(x=>!x.note); }
function itemKeys(text){ return new Set(keysFor([text]).filter(t=>!/\d/.test(t))); }
function jacc(a,b){ let n=0; a.forEach(x=>{ if(b.has(x)) n++; }); const u=a.size+b.size-n; return u?n/u:0; }
function mvSet(text){ const t=lowerDe(text); return new Set(MV.filter(w=>t.includes(w))); }
const normL=l=>lowerDe(l||'').replace(/[^a-z]/g,'');
const isJoint=l=>/gelenk|wirbelsaeule|hws|bws|lws|kopf/.test(lowerDe(l||''));
function shortish(items){ const s=items.filter(x=>x.text.length<=110); return s.length?s:items; }
const pickOne=a=>a[Math.floor(Math.random()*a.length)];

/* Ist ein Kandidat für Muskel m in Feld k womöglich auch richtig? Dann taugt er nicht als falsche Antwort. */
function conflicts(m,k,ctext,clabel){
  const ck=itemKeys(ctext);
  const fields=(k==='U'||k==='A')?['U','A','UA']:[k];
  for(const f of fields) for(const x of realItems(m,f)) if(jacc(ck,itemKeys(x.text))>=0.5) return true;
  if(k==='F'){
    const cm=mvSet(ctext); if(!cm.size) return true;
    for(const x of realItems(m,'F')){
      const xm=mvSet(x.text);
      const sameJoint=!(isJoint(clabel)&&isJoint(x.label)&&normL(clabel)!==normL(x.label));
      if(sameJoint&&[...cm].some(v=>xm.has(v))) return true;
    }
  }
  return false;
}
function forwardQ(m,k){
  const items=realItems(m,k); if(!items.length) return null;
  const it=pickOne(shortish(items));
  const len=it.text.length;
  const pool=[];
  M.forEach(o=>{ if(o.id===m.id) return; realItems(o,k).forEach(x=>pool.push({m:o.id,i:x.i,text:x.text,label:x.label,
    score:Math.abs(x.text.length-len)/Math.max(len,20)+(o.r===m.r?0:0.35)+(it.label&&normL(x.label)===normL(it.label)?-0.3:0)+Math.random()*0.5})); });
  pool.sort((a,b)=>a.score-b.score);
  const picks=[]; const keysSeen=[itemKeys(it.text)];
  for(const c of pool){
    if(picks.length>=NOPT-1) break;
    if(conflicts(m,k,c.text,c.label)) continue;
    const ck=itemKeys(c.text); if(!ck.size||keysSeen.some(s=>jacc(s,ck)>=0.4||[...ck].filter(x=>s.has(x)).length>=Math.min(3,ck.size))) continue;
    keysSeen.push(ck); picks.push([c.m,c.i]);
  }
  if(picks.length<NOPT-1) return null;
  return {t:'f',m:m.id,k,i:it.i,o:shuffle([[m.id,it.i],...picks])};
}
function reverseQ(m,k){
  if(k==='F') return null;
  const items=realItems(m,k).filter(x=>!x.label&&x.text.length<=110); if(!items.length) return null;
  const it=pickOne(items); const ik=itemKeys(it.text);
  const ok=o=>o.id!==m.id&&!realItems(o,k).some(x=>jacc(ik,itemKeys(x.text))>=0.5)&&!(k!=='I'&&realItems(o,k==='U'?'A':'U').some(x=>jacc(ik,itemKeys(x.text))>=0.5));
  const same=shuffle(M.filter(o=>o.r===m.r&&ok(o))), other=shuffle(M.filter(o=>o.r!==m.r&&ok(o)));
  const picks=[...same.slice(0,2),...other,...same.slice(2)].slice(0,NOPT-1).map(o=>o.id);
  if(picks.length<NOPT-1) return null;
  return {t:'r',m:m.id,k,i:it.i,o:shuffle([m.id,...picks])};
}
function makeQuestion(mid,k){
  const m=M[mid];
  const q=(Math.random()<0.35&&reverseQ(m,k))||forwardQ(m,k)||reverseQ(m,k);
  return q;
}
function qFields(m){ return QF.filter(k=>m[k]&&realItems(m,k).length); }

/* Darstellung */
const QTXT={
  f:{U:'Wo entspringt der Muskel?',A:'Wo setzt der Muskel an?',F:'Welche Funktion hat der Muskel?',I:'Welcher Nerv innerviert den Muskel?'},
  fp:{U:'Wo entspringt dieser Anteil?',A:'Wo setzt dieser Anteil an?',I:'Welcher Nerv innerviert diesen Anteil?'},
  r:{U:'Welcher Muskel entspringt hier?',A:'Welcher Muskel setzt hier an?',I:'Welcher Muskel wird von diesem Nerv innerviert?'}
};
const QLAB={U:'Ursprung',A:'Ansatz',F:'Funktion',I:'Innervation'};
function qItem(q){ return parseItem(M[q.m][q.k][q.i]); }
function qPinned(q){ return q.t==='f'&&q.k!=='F'&&!!qItem(q).label; }
function qText(q){ return q.t==='r'?QTXT.r[q.k]:(qPinned(q)?QTXT.fp[q.k]:QTXT.f[q.k]); }
function qSpeak(q){ return q.t==='r'?qText(q)+' '+qItem(q).text:M[q.m].n+'. '+qText(q); }
function correctKey(q){ return q.t==='f'?q.m+':'+q.i:String(q.m); }
function optList(q){
  if(q.t==='r') return q.o.map(id=>({key:String(id),text:M[id].n}));
  return q.o.map(([mid,i])=>{ const it=parseItem(M[mid][q.k][i]); return {key:mid+':'+i,text:(q.k==='F'&&it.label?it.label+': ':'')+it.text}; });
}
function qCardHTML(q,showName){
  const it=qItem(q); const m=M[q.m];
  if(q.t==='r'&&!showName) return `<article class="card qcard">
    <span class="pill">${QLAB[q.k]}</span>
    <p class="fact">${esc(it.text)}</p>
  </article>`;
  return `<article class="card qcard">
    <div class="pills"><span class="pill">${QLAB[q.k]}</span>${qPinned(q)?`<span class="pill neutral">${esc(it.label)}</span>`:''}</div>
    <h2 class="title-xl">${nameHTML(m.n)}</h2>
    ${q.t==='r'?`<p class="sub" style="margin:0">${esc(it.text)}</p>`:''}
  </article>`;
}
function optionsHTML(q,state){
  const st=state||{}; const corr=correctKey(q);
  return `<div class="opts" role="list">${optList(q).map((o,idx)=>{
    let c='opt'; const tags=[];
    if(st.reveal){ if(o.key===corr) c+=' right'; else if(o.key===st.mine) c+=' wrong'; else c+=' dim'; }
    else if(st.mine!=null){ c+= o.key===st.mine?' picked':' dim'; }
    if(st.reveal&&o.key===st.mine) tags.push('Du');
    if(st.reveal&&st.theirs!=null&&o.key===st.theirs) tags.push(esc(st.theirName||'Gegner'));
    return `<button class="${c}" role="listitem" data-opt="${o.key}" ${st.locked?'disabled':''}><span class="optl">${'ABCD'[idx]}</span><span class="optt">${esc(o.text)}</span>${tags.length?`<span class="opttag">${tags.join(' · ')}</span>`:''}</button>`;
  }).join('')}</div>`;
}

/* ---------- Duell ---------- */
const ROUNDS=10, QTIME=30000, REVEAL=6000, PASS=0.4;
const DUEL={room:null,user:null,ready:false,loading:false,myPeer:null,nick:'',view:'off',outInv:null,decline:null,seen:new Set(),
  named:null,role:null,code:null,unsub:[],timers:[],game:null,hg:null,lastKey:null,myAns:null,roundStart:0,
  tInt:null,deadline:null,rTimer:null,revInt:null,hist:[],oppNick:'',target:null};

/* Bewertung: richtig, wenn die richtige Antwort angetippt wurde; schnelle richtige Antworten bringen Bonus */
function evalChoice(c,key,t){
  c=typeof c==='string'?c:''; const ok=!!c&&c===key; t=Math.min(Number(t)||QTIME,QTIME);
  const bonus=ok?(t<=10000?2:t<=20000?1:0):0;
  return {c,ok,pt:ok?1+bonus:0,bonus,t};
}
function pickQs(){
  const qs=[]; const ms=shuffle(M.slice());
  for(const m of ms){ if(qs.length>=ROUNDS) break; const ks=shuffle(qFields(m)); for(const k of ks){ const q=makeQuestion(m.id,k); if(q){ qs.push(q); break; } } }
  return qs;
}
function newCode(){return String(Math.floor(1000+Math.random()*9000));}
const isHost=()=>DUEL.role==='host';
const curGame=()=>isHost()?DUEL.game:DUEL.hg;
const myNick=()=>(DUEL.nick||'').trim()||'Spieler';
const oppName=()=>DUEL.oppNick||'Gegner';

/* ----- Einstieg ----- */
async function openDuel(){

}

/* ----- Lobby ----- */
async function initLobby(){
  if(DUEL.ready||DUEL.loading) return;
  DUEL.loading=true;
  const conn=await PLATFORM.connect().catch(()=>null);
  DUEL.loading=false;
  if(!conn||!conn.room){ DUEL.failed=true; if(DUEL.view==='lobby') renderLobby(); return; }
  DUEL.failed=false; DUEL.ready=true; DUEL.room=conn.room;
  let nm=lsGet('mt-nick'); if(!nm) nm=conn.name||'';
  DUEL.nick=(nm||'').slice(0,24);
  DUEL.room.onPeers(ch=>{ const me=ch.peers.find(p=>p.sameTab); if(me) DUEL.myPeer=me.peer; onLobbyPeers(); },()=>{});
  pushLobby();
  if(DUEL.view==='lobby') renderLobby();
}
function resetLobby(){ DUEL.ready=false; DUEL.failed=false; DUEL.room=null; DUEL.myPeer=null; }
function pushLobby(){
  if(!DUEL.room) return;
  DUEL.room.presence({app:'mt',nick:myNick(),busy:DUEL.view==='game'||DUEL.view==='wait',inv:DUEL.outInv||null,dec:DUEL.decline||null}).catch(()=>{});
}
function lobbyPeers(){ return DUEL.room?DUEL.room.peers().filter(p=>!p.isMe&&p.kind==='viewer'&&p.presence&&p.presence.app==='mt'):[]; }
function onLobbyPeers(){
  const ps=lobbyPeers();
  if(DUEL.view==='wait'&&DUEL.outInv){
    const d=ps.find(p=>p.presence.dec&&p.presence.dec.to===DUEL.myPeer&&p.presence.dec.code===DUEL.outInv.code);
    if(d){ leaveDuel('Deine Herausforderung wurde abgelehnt.'); return; }
  }
  const inc=ps.find(p=>p.presence.inv&&p.presence.inv.to===DUEL.myPeer&&!DUEL.seen.has(p.presence.inv.code));
  showInvite(inc||null);
  if(DUEL.view==='lobby'){ renderOnline(); if(PLATFORM.refreshLobbyExtra) PLATFORM.refreshLobbyExtra(); }
}
const inviteBar=document.getElementById('inviteBar');
function showInvite(p){
  if(!p||DUEL.view==='game'||DUEL.view==='wait'){ inviteBar.hidden=true; return; }
  const code=p.presence.inv.code;
  inviteBar.innerHTML=`<div class="sheet-in"><p><b>${esc(p.presence.nick||'Jemand')}</b> fordert dich zum Duell heraus.</p><div class="btnrow"><button class="btn plain" id="invNo">Ablehnen</button><button class="btn primary" id="invYes">Annehmen</button></div></div>`;
  inviteBar.hidden=false;

  inviteBar.querySelector('#invNo').onclick=()=>{ DUEL.seen.add(code); inviteBar.hidden=true; DUEL.decline={to:p.peer,code}; pushLobby();
    setTimeout(()=>{ if(DUEL.decline&&DUEL.decline.code===code){ DUEL.decline=null; pushLobby(); } },15000); };
}

    <div class="center" style="display:flex;flex-direction:column;gap:6px"><h2 class="pagetitle">Duell</h2><p class="sub" style="margin:0">10 Runden · gleiche Frage für beide · 30 Sekunden · 8 Antworten, eine ist richtig. Richtig gibt 1 Punkt, wer schnell antwortet bekommt Bonus: unter 10 s +2, unter 20 s +1.</p></div>
    ${body}
    <p class="hint" id="lobbyHint" role="status"></p>
  </div>`;
  if(msg) setLobbyHint(msg,true);
  const rt=view.querySelector('#retry'); if(rt) rt.onclick=()=>{ DUEL.failed=false; initLobby(); renderLobby(); };
  if(PLATFORM.bindAccount) PLATFORM.bindAccount();
  if(DUEL.room&&PLATFORM.bindLobbyExtra) PLATFORM.bindLobbyExtra();
  if(!DUEL.room) return;
  const ni=view.querySelector('#nick'); ni.value=DUEL.nick;
  let nt=null; ni.oninput=()=>{ DUEL.nick=ni.value.slice(0,24); lsSet('mt-nick',DUEL.nick); clearTimeout(nt); nt=setTimeout(()=>{ pushLobby(); if(PLATFORM.onNick) PLATFORM.onNick(DUEL.nick); },600); };
  view.querySelector('#mkCode').onclick=()=>hostDuel(newCode(),null);
  const ci=view.querySelector('#codeIn');
  const go=()=>{ const c=ci.value.replace(/\D/g,''); if(c.length!==4){ setLobbyHint('Der Code hat 4 Ziffern.',true); return; } joinDuel(c); };
  view.querySelector('#joinCode').onclick=go; ci.onkeydown=e=>{ if(e.key==='Enter') go(); };
  renderOnline();
  onLobbyPeers();
}
function setLobbyHint(t,warn){ const h=document.getElementById('lobbyHint'); if(h){ h.textContent=t; h.classList.toggle('warn',!!warn);} }
function renderOnline(){
  const box=document.getElementById('onlineList'); if(!box) return;
  const ps=lobbyPeers().filter(p=>!(PLATFORM.isFriend&&PLATFORM.isFriend(p.by)));
  if(!ps.length){ box.innerHTML=`<div class="row"><span class="label"><span>${PLATFORM.lobbyExtra?'Gerade ist sonst niemand online.':'Gerade ist niemand außer dir online.'}</span><small>${PLATFORM.shareHint}</small></span></div>`; return; }
  const seen=new Set();
  box.innerHTML=ps.filter(p=>{ const k=p.by||p.peer; if(seen.has(k)) return false; seen.add(k); return true; }).map(p=>`<div class="row">${PLATFORM.avatarFor?PLATFORM.avatarFor(p.by,p.presence.nick,p.presence.busy):`<i class="online${p.presence.busy?' busy':''}"></i>`}<span class="label"><span>${esc(p.presence.nick||'Spieler')}</span><small>${p.presence.busy?'im Duell':'bereit'}</small></span>${PLATFORM.addFriendUid&&p.by?`<button class="iconbtn addf" data-addf="${esc(p.by)}" aria-label="Als Freund hinzufügen" title="Als Freund hinzufügen">+</button>`:''}<button class="btn tinted small" data-ch="${esc(p.peer)}" ${p.presence.busy?'disabled':''}>Herausfordern</button></div>`).join('');
  box.querySelectorAll('[data-addf]').forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await PLATFORM.addFriendUid(b.dataset.addf); setLobbyHint('Freund hinzugefügt.'); }catch(e){ b.disabled=false; setLobbyHint('Das hat nicht geklappt.',true); } });
  box.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ const p=lobbyPeers().find(x=>x.peer===b.dataset.ch); if(p) hostDuel(newCode(),p); });
}

/* ----- Duell-Raum ----- */
async function hostDuel(code,target){
  DUEL.role='host'; DUEL.code=code; DUEL.view='wait';
  DUEL.outInv=target?{to:target.peer,code}:null; DUEL.target=target?(target.presence.nick||'Spieler'):null;
  pushLobby(); renderWait(); await enterRoom(code);
}
async function joinDuel(code){
  DUEL.role='guest'; DUEL.code=code; DUEL.view='wait'; DUEL.outInv=null; DUEL.target=null;
  pushLobby(); renderWait(); await enterRoom(code);
}
async function enterRoom(code){
  let r;
  try{ r=await DUEL.room.join('duel-'+code); }
  catch(e){ leaveDuel('Dem Duell konnte nicht beigetreten werden. Versuch es gleich nochmal.'); return; }
  if(DUEL.view!=='wait'||DUEL.code!==code){ r.leave().catch(()=>{}); return; }
  DUEL.named=r;
  DUEL.unsub.push(r.onPeers(()=>onDuelPeers(),()=>{ if(DUEL.named===r) leaveDuel('Die Verbindung zum Duell ist abgebrochen.'); }));
  r.presence({role:DUEL.role,nick:myNick()}).catch(()=>{});
  if(DUEL.role==='guest') DUEL.timers.push(setTimeout(()=>{ if(DUEL.named===r&&!hostPeer()) leaveDuel('Kein offenes Duell mit diesem Code gefunden.'); },9000));
}
function roomPeers(){ return DUEL.named?DUEL.named.peers():[]; }
function hostPeer(){ return roomPeers().find(p=>!p.isMe&&p.presence&&p.presence.role==='host'); }
function oppPeer(){ if(isHost()){ const g=DUEL.game; return g?roomPeers().find(p=>p.peer===g.op):null; } return hostPeer(); }
function myRoomPeer(){ const me=roomPeers().find(p=>p.sameTab); return me?me.peer:DUEL.myPeer; }

function onDuelPeers(){
  if(!DUEL.named) return;
  if(isHost()){
    const g=DUEL.game;
    if(!g){ const gp=roomPeers().find(p=>!p.isMe&&p.presence&&p.presence.role==='guest'); if(gp) startGame(gp.peer); return; }
    const opp=oppPeer();
    if(!opp){ if(g.ph!=='end') leaveDuel('Dein Gegner hat das Duell verlassen.'); return; }
    DUEL.oppNick=opp.presence.nick||'Gegner';
    hostCheck(); renderOppStatus();
  } else {
    const h=hostPeer();
    if(!h){ if(DUEL.hg&&DUEL.hg.ph!=='end') leaveDuel('Dein Gegner hat das Duell verlassen.'); return; }
    DUEL.oppNick=h.presence.nick||'Gegner'; DUEL.oppId=h.by||h.peer;
    const g=h.presence.g;
    if(!g){ const s=document.getElementById('waitSub'); if(s) s.textContent='Verbunden. Gleich geht es los …'; return; }
    if(g.op!==myRoomPeer()){ leaveDuel('Dieses Duell läuft schon mit jemand anderem.'); return; }
    guestState(g);
  }
}

/* Host steuert den Ablauf */
function startGame(op){
  DUEL.outInv=null;
  DUEL.game={id:Math.random().toString(36).slice(2,8),qs:pickQs(),r:0,ph:'q',op,sc:[0,0]};
  DUEL.hist=[]; DUEL.view='game'; pushLobby();
  const opp=oppPeer(); DUEL.oppNick=(opp&&opp.presence.nick)||'Gegner';
  pushHost(); beginRound();
}
function pushHost(){ if(DUEL.named) DUEL.named.presence({role:'host',nick:myNick(),g:DUEL.game}).catch(()=>{}); }
function beginRound(){ startRoundUI(DUEL.game); DUEL.deadline=setTimeout(hostReveal,QTIME+3000); }
function hostCheck(){
  const g=DUEL.game; if(!g||g.ph!=='q') return;
  const opp=oppPeer(); const oa=opp&&opp.presence.a;
  const oLocked=oa&&oa.g===g.id&&oa.r===g.r&&oa.lk;
  if(DUEL.myAns&&oLocked) hostReveal();
}
function hostReveal(){
  const g=DUEL.game; if(!g||g.ph!=='q') return;
  clearRoundTimers(); stopRec();
  if(!DUEL.myAns){ DUEL.myAns={g:g.id,r:g.r,c:'',t:QTIME,lk:true}; }
  const opp=oppPeer(); let oa=opp&&opp.presence.a;
  if(!(oa&&oa.g===g.id&&oa.r===g.r)) oa={c:'',t:QTIME};
  const key=correctKey(g.qs[g.r]);
  const h=evalChoice(DUEL.myAns.c,key,DUEL.myAns.t), o=evalChoice(oa.c,key,oa.t);
  g.sc=[g.sc[0]+h.pt,g.sc[1]+o.pt]; g.ph='rev'; g.res={h,o};
  pushHost(); showReveal(g);
  DUEL.rTimer=setTimeout(()=>{
    if(DUEL.game!==g) return;
    delete g.res;
    if(g.r+1>=ROUNDS){ g.ph='end'; pushHost(); showEnd(g); }
    else { g.r++; g.ph='q'; pushHost(); beginRound(); }
  },REVEAL);
}

/* Gast folgt dem Host */
function guestState(g){
  const prev=DUEL.hg; DUEL.hg=g;
  const key=g.id+':'+g.r+':'+g.ph;
  if(key===DUEL.lastKey){ renderOppStatus(); return; }
  DUEL.lastKey=key;
  if(!prev||prev.id!==g.id) DUEL.hist=[];
  if(g.ph==='q'){ DUEL.view='game'; pushLobby(); startRoundUI(g); }
  else if(g.ph==='rev'&&g.res){ clearRoundTimers(); stopRec(); showReveal(g); }
  else if(g.ph==='end'){ clearRoundTimers(); showEnd(g); }
}

/* ----- Anzeige ----- */
function scores(g){ return isHost()?[g.sc[0],g.sc[1]]:[g.sc[1],g.sc[0]]; }
function scoreHTML(g){
  const [a,b]=scores(g);
  return `<div class="score"><div class="sc me"><small>Du</small><b>${a}</b></div><div class="sc mid">Runde ${Math.min(g.r+1,ROUNDS)} von ${ROUNDS}</div><div class="sc op"><small>${esc(oppName())}</small><b>${b}</b></div></div>`;
}
function renderWait(){
  stopRec(); clearRoundTimers(); inviteBar.hidden=true;
  setBack('Abbrechen',()=>leaveDuel());
  const host=isHost();
  view.innerHTML=`<div class="stack">
    <section class="card center" style="padding-block:28px">
      ${host&&!DUEL.target?`<p class="sectionhead">Dein Duell-Code</p><div class="codebig">${esc(DUEL.code)}</div><p class="sub" style="margin:0">Schick den Code deinem Freund. Er tippt im Duell auf „Beitreten“ und gibt ihn ein.</p>`:''}
      ${host&&DUEL.target?`<p class="sectionhead">Herausforderung gesendet</p><p style="margin:0">Warte, bis <b>${esc(DUEL.target)}</b> annimmt …</p>`:''}
      ${!host?`<p class="sectionhead">Duell ${esc(DUEL.code)}</p><p style="margin:0" id="waitSub">Verbinde …</p>`:''}
      <div class="spinner" aria-hidden="true"></div>
    </section>
    <button class="btn plain" id="cancel">Abbrechen</button>
  </div>`;
  view.querySelector('#cancel').onclick=()=>leaveDuel();
}
function startRoundUI(g){
  clearRoundTimers(); stopRec();
  setBack('Aufgeben',()=>leaveDuel());
  const q=g.qs[g.r];
  DUEL.myAns=null; DUEL.roundStart=performance.now();
  view.innerHTML=`<div class="stack">${scoreHTML(g)}
    <div class="tbar" aria-hidden="true"><span id="tfill"></span></div>
    <p class="footnote" style="margin-top:-12px"><span id="tleft">30</span> Sekunden</p>
    ${qCardHTML(q,false)}
    <section class="stack-sm">
      <p class="question">${esc(qText(q))}</p>
      <div id="optBox">${optionsHTML(q)}</div>
    </section>
    <p class="opp" id="oppStat"><i></i>${esc(oppName())} denkt nach …</p>
  </div>`;
  view.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>lockAnswer(b.dataset.opt));
  window.scrollTo({top:0});
  if(autoRead) speak(qSpeak(q));
  const fill=document.getElementById('tfill'), left=document.getElementById('tleft');
  DUEL.tInt=setInterval(()=>{
    const el=performance.now()-DUEL.roundStart, rest=Math.max(0,QTIME-el);
    if(fill){ fill.style.width=(rest/QTIME*100)+'%'; fill.classList.toggle('low',rest<8000); }
    if(left) left.textContent=Math.ceil(rest/1000);
    if(rest<=0){ clearInterval(DUEL.tInt); DUEL.tInt=null; if(!DUEL.myAns) lockAnswer(''); }
  },200);
  renderOppStatus();
}
function lockAnswer(choice){
  const g=curGame(); if(!g||g.ph!=='q'||DUEL.myAns) return;
  const t=Math.min(Math.round(performance.now()-DUEL.roundStart),QTIME);
  DUEL.myAns={g:g.id,r:g.r,c:choice,t,lk:true};
  if(DUEL.named) DUEL.named.presence({a:DUEL.myAns}).catch(()=>{});
  const box=document.getElementById('optBox'); if(box) box.innerHTML=optionsHTML(g.qs[g.r],{mine:choice,locked:true});
  const st=document.getElementById('oppStat');
  if(st&&!st.dataset.me){ st.dataset.me='1'; st.insertAdjacentHTML('beforebegin',`<p class="footnote">${choice?`Eingeloggt nach ${(t/1000).toFixed(1).replace('.',',')} s`:'Zeit abgelaufen'}</p>`); }
  if(isHost()) hostCheck();
}
function renderOppStatus(){
  const el=document.getElementById('oppStat'); const g=curGame(); if(!el||!g||g.ph!=='q') return;
  const o=oppPeer(); const a=o&&o.presence.a;
  const locked=a&&a.g===g.id&&a.r===g.r&&a.lk;
  el.innerHTML=locked?`<i class="done"></i>${esc(oppName())} hat eingeloggt`:`<i></i>${esc(oppName())} denkt nach …`;
}
function verdictHTML(label,r){
  return `<div class="pv ${r.ok?'ok':'no'}"><div class="pvh"><small>${esc(label)}</small><b>${r.ok?'Richtig':!r.c?'Keine Antwort':'Falsch'}</b><span>${r.ok?`+${r.pt}${r.bonus?` (inkl. ${r.bonus} Bonus)`:''}`:'+0'}</span></div><small class="tm">${!r.c?'—':(r.t/1000).toFixed(1).replace('.',',')+' s'}</small></div>`;
}
function showReveal(g){
  const q=g.qs[g.r]; const m=M[q.m];
  const mine=isHost()?g.res.h:g.res.o, theirs=isHost()?g.res.o:g.res.h;
  if(!DUEL.hist.some(h=>h.r===g.r)) DUEL.hist.push({r:g.r,mid:q.m,fk:q.k,me:mine,op:theirs});
  const last=g.r+1>=ROUNDS;
  view.innerHTML=`<div class="stack">${scoreHTML(g)}
    <div class="duo">${verdictHTML('Du',mine)}${verdictHTML(oppName(),theirs)}</div>
    ${qCardHTML(q,true)}
    ${optionsHTML(q,{reveal:true,mine:mine.c,theirs:theirs.c,theirName:oppName(),locked:true})}
    <p class="footnote" id="nextIn">${last?'Gleich kommt die Auswertung …':'Nächste Runde gleich …'}</p>
  </div>`;
  const fb=view.querySelector('#figbtn'); if(fb) fb.onclick=()=>fb.closest('.fig').classList.toggle('big');
  window.scrollTo({top:0});
  const t0=performance.now(); const ni=document.getElementById('nextIn');
  DUEL.revInt=setInterval(()=>{ const s=Math.max(0,Math.ceil((REVEAL-(performance.now()-t0))/1000)); if(ni) ni.textContent=(last?'Auswertung in ':'Nächste Runde in ')+s+' s'; },250);
  if(autoRead) speak((mine.ok?'Richtig':'Falsch')+'. '+oppName()+(theirs.ok?' richtig':' falsch')+'.');
}
function showEnd(g){
  clearRoundTimers(); stopRec(); DUEL.view='game';
  setBack('Lobby',()=>leaveDuel());
  const [a,b]=scores(g);
  const head=a>b?'Gewonnen!':a<b?'Verloren':'Unentschieden';
  const rows=DUEL.hist.sort((x,y)=>x.r-y.r).map(h=>`<div class="row"><span class="label"><span>${esc(M[h.mid].n)}</span><small>${esc(QLAB[h.fk]||'')}</small></span><span class="badges"><span class="badge ${h.me.ok?'good':'bad'}">Du +${h.me.pt}</span><span class="badge ${h.op.ok?'good':'bad'}">${esc(oppName())} +${h.op.pt}</span></span></div>`).join('');
  view.innerHTML=`<div class="stack">
    <div class="center" style="display:flex;flex-direction:column;gap:6px"><h2 class="pagetitle" style="font-size:34px;${a>b?'color:var(--accent)':''}">${head}</h2><p class="sub" style="font-size:20px;font-variant-numeric:tabular-nums">Du ${a} : ${b} ${esc(oppName())}</p></div>
    <p class="footnote" id="h2hLine"></p>
    <section class="group list">${rows}</section>
    <div class="stack-sm">${isHost()?'<button class="btn primary" id="again">Revanche</button>':'<p class="footnote">Revanche? Dein Gegner kann eine neue Runde starten. Bleib einfach hier.</p>'}<button class="btn plain" id="leave">Duell verlassen</button></div>
  </div>`;
  const ag=view.querySelector('#again'); if(ag) ag.onclick=()=>{ const opp=oppPeer(); if(opp) startGame(opp.peer); else leaveDuel('Dein Gegner ist nicht mehr da.'); };
  view.querySelector('#leave').onclick=()=>leaveDuel();
  window.scrollTo({top:0});
  if(autoRead) speak(head+'. '+a+' zu '+b+'.');
  if(PLATFORM.onGameEnd&&DUEL.reported!==g.id){ DUEL.reported=g.id; const opp=isHost()?(oppPeer()||{}).by||g.op:DUEL.oppId; PLATFORM.onGameEnd({gid:g.id,opp,me:a,them:b,host:isHost()}); }
}
function clearRoundTimers(){
  clearInterval(DUEL.tInt); DUEL.tInt=null; clearTimeout(DUEL.deadline); DUEL.deadline=null; clearInterval(DUEL.revInt); DUEL.revInt=null;
}
function leaveDuel(msg){
  clearRoundTimers(); clearTimeout(DUEL.rTimer); DUEL.rTimer=null;
  DUEL.timers.forEach(clearTimeout); DUEL.timers=[];
  DUEL.unsub.forEach(u=>{try{u()}catch(e){}}); DUEL.unsub=[];
  const r=DUEL.named; DUEL.named=null; if(r) r.leave().catch(()=>{});
  DUEL.game=null; DUEL.hg=null; DUEL.lastKey=null; DUEL.myAns=null; DUEL.outInv=null; DUEL.role=null; DUEL.code=null; DUEL.target=null;
  if(synth) synth.cancel();
  renderLobby(msg);
}

/* ---------- Freunde, Rangliste und Bilanz (Website / Firebase) ---------- */
const SOC={profile:null,friends:{},info:{},h2h:{},ready:false,listening:false};
const CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const pairKey=(a,b)=>[a,b].sort().join('_');
function newFriendCode(){ let c=''; for(let i=0;i<6;i++) c+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)]; return c; }
function emptyStats(){ return {games:0,wins:0,losses:0,draws:0,points:0}; }

async function ensureProfile(){
  if(!FB.user) return null;
  const u=FB.user; const ref=FB.db.ref('users/'+u.uid);
  let p=(await ref.once('value')).val()||{};
  if(!p.code){
    for(let t=0;t<6&&!p.code;t++){
      const c=newFriendCode();
      try{ await FB.db.ref('codes/'+c).set(u.uid); p.code=c; }catch(e){}
    }
  }
  p.name=p.name||u.displayName||lsGet('mt-nick')||'Spieler';
  p.nameLower=lowerDe(p.name).trim();
  p.stats=Object.assign(emptyStats(),p.stats||{});
  p.score=p.stats.wins*3+p.stats.draws;
  await ref.set(p);
  SOC.profile=p; SOC.ready=true; SOC.info[u.uid]=p; setProfileIcon(p.photo);
  if(!SOC.listening){
    SOC.listening=true;
    FB.db.ref('friends/'+u.uid).on('value',s=>{ SOC.friends=s.val()||{}; loadFriendData(); });
  }
  return p;
}
async function loadFriendData(){
  const me=FB.user&&FB.user.uid; if(!me) return;
  const ids=Object.keys(SOC.friends);
  await Promise.all(ids.map(async fid=>{
    try{ SOC.info[fid]=(await FB.db.ref('users/'+fid).once('value')).val()||{name:'Spieler'}; }catch(e){ SOC.info[fid]=SOC.info[fid]||{name:'Spieler'}; }
    try{ SOC.h2h[fid]=(await FB.db.ref('h2h/'+pairKey(me,fid)).once('value')).val(); }catch(e){}
  }));
  renderFriendList(); renderOthersOnline();
}
function isFriend(uid){ return !!(uid&&SOC.friends[uid]); }
function record(fid){
  const me=FB.user.uid; const h=SOC.h2h[fid];
  if(!h) return {games:0,w:0,l:0,d:0,pm:0,pf:0,last:null};
  const w=(h.w||{})[me]||0, l=(h.w||{})[fid]||0;
  return {games:h.games||0,w,l,d:h.d||0,pm:(h.pts||{})[me]||0,pf:(h.pts||{})[fid]||0,last:h.last||null};
}
async function addFriendUid(fid){
  const me=FB.user.uid; if(!fid||fid===me) return false;
  await FB.db.ref('friends/'+me+'/'+fid).set(true);
  await FB.db.ref('friends/'+fid+'/'+me).set(true);
  return true;
}
async function addFriendCode(code){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==6) return 'Ein Freundescode hat 6 Zeichen.';
  const fid=(await FB.db.ref('codes/'+code).once('value')).val();
  if(!fid) return 'Zu diesem Code gibt es kein Konto.';
  if(fid===FB.user.uid) return 'Das ist dein eigener Code.';
  if(isFriend(fid)) return 'Ihr seid schon befreundet.';
  await addFriendUid(fid); return null;
}
async function removeFriend(fid){
  const me=FB.user.uid;
  await FB.db.ref('friends/'+me+'/'+fid).remove();
  try{ await FB.db.ref('friends/'+fid+'/'+me).remove(); }catch(e){}
}
async function syncName(n){ n=(n||'').trim().slice(0,24); if(!FB.user||!SOC.ready||!n) return; try{ await FB.db.ref('users/'+FB.user.uid+'/name').set(n); await FB.db.ref('users/'+FB.user.uid+'/nameLower').set(lowerDe(n)); SOC.profile.name=n; }catch(e){} }

/* Ergebnis eines Duells speichern: jeder seine eigene Statistik, der Gastgeber die gemeinsame Bilanz */
async function saveGameResult(r){
  const me=FB.user&&FB.user.uid; if(!me) return;
  const res=r.me>r.them?'wins':r.me<r.them?'losses':'draws';
  try{
    await FB.db.ref('users/'+me).transaction(p=>{
      p=p||{}; p.stats=Object.assign(emptyStats(),p.stats||{});
      if(p.lastGid===r.gid) return p;
      p.stats.games++; p.stats[res]++; p.stats.points+=r.me; p.lastGid=r.gid;
      p.score=p.stats.wins*3+p.stats.draws; p.name=p.name||(SOC.profile&&SOC.profile.name)||'Spieler'; return p;
    });
  }catch(e){}
  if(r.host&&r.opp){
    try{
      await FB.db.ref('h2h/'+pairKey(me,r.opp)).transaction(h=>{
        h=h||{games:0,d:0,w:{},pts:{}};
        if(h.lastGid===r.gid) return h;
        h.w=h.w||{}; h.pts=h.pts||{};
        h.games=(h.games||0)+1;
        if(r.me>r.them) h.w[me]=(h.w[me]||0)+1; else if(r.me<r.them) h.w[r.opp]=(h.w[r.opp]||0)+1; else h.d=(h.d||0)+1;
        h.pts[me]=(h.pts[me]||0)+r.me; h.pts[r.opp]=(h.pts[r.opp]||0)+r.them;
        h.last=Date.now(); h.lastGid=r.gid; return h;
      });
    }catch(e){}
  }
  try{ await ensureProfile(); }catch(e){}
  await loadFriendData();
  const el=document.getElementById('h2hLine');
  if(el&&r.opp){ const rc=record(r.opp); if(rc.games) el.textContent=`Bilanz gegen ${oppName()}: ${rc.w} : ${rc.l}${rc.d?` (${rc.d} unentschieden)`:''}`; }
}

/* ----- Ansichten ----- */
function lobbyExtraHTML(){
  if(!SOC.profile) return '';
  return `<p class="group-label">Freunde</p>
    <section class="group list" id="friendList"></section>
    <section class="group"><button class="row" id="toProfile"><span class="tile" style="background:var(--ok)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="label">Freunde hinzufügen<small>per Name oder Freundescode</small></span>${IC.chev}</button></section>
    <section class="group"><button class="row" id="lbRow"><span class="tile" style="background:var(--warn)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 3h10v2h3v3a5 5 0 0 1-4.6 5A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 8.6 13 5 5 0 0 1 4 8V5h3zm0 4H6v1a3 3 0 0 0 1 2.2zm10 0v3.2A3 3 0 0 0 18 8V7z"/></svg></span><span class="label">Rangliste</span>${IC.chev}</button></section>`;
}
function bindLobbyExtra(){
  const tp=document.getElementById('toProfile'); if(tp) tp.onclick=()=>renderProfile();
  const lb=document.getElementById('lbRow'); if(lb) lb.onclick=()=>renderLeaderboard('all');
  renderFriendList();
}
function renderFriendList(){
  const box=document.getElementById('friendList'); if(!box) return;
  const ids=Object.keys(SOC.friends);
  if(!ids.length){ box.innerHTML=`<div class="row"><span class="label"><span>Noch keine Freunde</span><small>Füge Freunde per Name oder Freundescode hinzu.</small></span></div>`; return; }
  const online=new Map(lobbyPeers().map(p=>[p.by,p]));
  const sorted=ids.sort((a,b)=>(online.has(b)-online.has(a))||((SOC.info[a]||{}).name||'').localeCompare((SOC.info[b]||{}).name||''));
  box.innerHTML=sorted.map(fid=>{ const p=online.get(fid); const rc=record(fid); const nm=(p&&p.presence.nick)||(SOC.info[fid]||{}).name||'Spieler';
    return `<div class="row">${avatarHTML(fid,nm,p?(p.presence.busy?'busy':'on'):'off')}<button class="label rowlink" data-fr="${esc(fid)}"><span>${esc(nm)}</span><small>${p?(p.presence.busy?'im Duell':'online'):'offline'}${rc.games?` · Bilanz ${rc.w} : ${rc.l}`:''}</small></button>${p&&!p.presence.busy?`<button class="btn tinted small" data-chf="${esc(p.peer)}">Herausfordern</button>`:''}</div>`; }).join('');
  box.querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>renderFriend(b.dataset.fr));
  box.querySelectorAll('[data-chf]').forEach(b=>b.onclick=()=>{ const p=lobbyPeers().find(x=>x.peer===b.dataset.chf); if(p) hostDuel(newCode(),p); });
}
function fmtDate(ts){ if(!ts) return '—'; try{ return new Date(ts).toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return '—'; } }
function renderFriend(fid){
  DUEL.view='friend'; S.phase='duel'; setBack('Duell',()=>renderLobby());
  const info=SOC.info[fid]||{}; const rc=record(fid); const p=lobbyPeers().find(x=>x.by===fid);
  const nm=(p&&p.presence.nick)||info.name||'Spieler';
  const st=Object.assign(emptyStats(),info.stats||{});
  view.innerHTML=`<div class="stack">
    <div class="center" style="display:flex;flex-direction:column;gap:6px;align-items:center">${avatarHTML(fid,nm,null,'xl')}<h2 class="pagetitle">${esc(nm)}</h2><p class="sub" style="margin:0">${p?(p.presence.busy?'gerade im Duell':'online'):'offline'}</p></div>
    <div class="score"><div class="sc me"><small>Du</small><b>${rc.w}</b></div><div class="sc mid">Siege<br>${rc.games} ${rc.games===1?'Duell':'Duelle'}</div><div class="sc op"><small>${esc(nm)}</small><b>${rc.l}</b></div></div>
    <p class="group-label">Eure Bilanz</p>
    <section class="group list">
      <div class="row"><span class="label">Duelle gegeneinander</span><span class="value">${rc.games}</span></div>
      <div class="row"><span class="label">Deine Siege</span><span class="value">${rc.w}</span></div>
      <div class="row"><span class="label">Siege von ${esc(nm)}</span><span class="value">${rc.l}</span></div>
      <div class="row"><span class="label">Unentschieden</span><span class="value">${rc.d}</span></div>
      <div class="row"><span class="label">Ø Punkte pro Duell</span><span class="value">${rc.games?(rc.pm/rc.games).toFixed(1).replace('.',','):'—'} : ${rc.games?(rc.pf/rc.games).toFixed(1).replace('.',','):'—'}</span></div>
      <div class="row"><span class="label">Letztes Duell</span><span class="value">${fmtDate(rc.last)}</span></div>
    </section>
    <p class="group-label">Gesamt von ${esc(nm)}</p>
    <section class="group list">
      <div class="row"><span class="label">Ranglistenpunkte</span><span class="value">${st.wins*3+st.draws}</span></div>
      <div class="row"><span class="label">Duelle · Siege</span><span class="value">${st.games} · ${st.wins}</span></div>
    </section>
    ${p&&!p.presence.busy?'<button class="btn primary" id="frCh">Herausfordern</button>':''}
    <button class="btn plain" id="frRm" style="color:var(--muted)">Freund entfernen</button>
    <p class="hint" id="frHint" role="status"></p>
  </div>`;
  const ch=document.getElementById('frCh'); if(ch) ch.onclick=()=>hostDuel(newCode(),p);
  const rm=document.getElementById('frRm');
  rm.onclick=async()=>{ if(rm.dataset.sure!=='1'){ rm.dataset.sure='1'; rm.textContent='Wirklich entfernen? Nochmal tippen'; rm.style.color='var(--accent)'; return; } rm.disabled=true; await removeFriend(fid); delete SOC.info[fid]; renderLobby('Freund entfernt.'); };
  window.scrollTo({top:0});
}
async function renderLeaderboard(mode){
  DUEL.view='board'; S.phase='duel'; setBack('Duell',()=>renderLobby());
  view.innerHTML=`<div class="stack">
    <h2 class="pagetitle">Rangliste</h2>
    <div class="seg" role="group" aria-label="Rangliste"><button data-lb="all" aria-pressed="${mode==='all'}">Alle</button><button data-lb="friends" aria-pressed="${mode==='friends'}">Freunde</button></div>
    <section class="group list" id="lbList"><div class="row"><span class="label"><span>Lade …</span></span></div></section>
    <p class="footnote">Sieg 3 Punkte · Unentschieden 1 Punkt</p>
  </div>`;
  view.querySelectorAll('[data-lb]').forEach(b=>b.onclick=()=>renderLeaderboard(b.dataset.lb));
  window.scrollTo({top:0});
  const me=FB.user.uid; let rows=[];
  try{
    if(mode==='all'){
      const snap=await FB.db.ref('users').orderByChild('score').limitToLast(100).once('value');
      const v=snap.val()||{}; rows=Object.keys(v).map(id=>Object.assign({id},v[id]));
    } else {
      const ids=[me,...Object.keys(SOC.friends)];
      rows=(await Promise.all(ids.map(async id=>{ try{ return Object.assign({id},(await FB.db.ref('users/'+id).once('value')).val()||{}); }catch(e){ return null; } }))).filter(Boolean);
    }
  }catch(e){ const l=document.getElementById('lbList'); if(l) l.innerHTML='<div class="row"><span class="label">Die Rangliste konnte nicht geladen werden.</span></div>'; return; }
  rows=rows.filter(r=>r.id===me||(r.stats&&r.stats.games>0));
  rows.sort((a,b)=>(b.score||0)-(a.score||0)||((b.stats||{}).wins||0)-((a.stats||{}).wins||0));
  const l=document.getElementById('lbList'); if(!l||DUEL.view!=='board') return;
  if(!rows.length){ l.innerHTML='<div class="row"><span class="label">Noch keine Duelle gespielt.</span></div>'; return; }
  l.innerHTML=rows.map((r,i)=>{ const st=Object.assign(emptyStats(),r.stats||{}); return `<div class="row${r.id===me?' me-row':''}"><span class="rank">${i+1}</span>${avatarHTML(r.id,r.name||'Spieler',null,'',r.photo||null)}<span class="label"><span>${esc(r.name||'Spieler')}${r.id===me?' (du)':''}</span><small>${st.games} Duelle · ${st.wins} Siege</small></span><span class="value"><b>${r.score||0}</b></span></div>`; }).join('');
}

/* ----- Profilbilder ----- */
const AV_COL=['#E0453A','#F08A24','#2F9E5B','#1F8FBF','#5B5BD6','#B24FC9','#D94C86','#7A8B99'];
function avColor(uid){ let h=0; for(const c of String(uid||'x')) h=(h*31+c.charCodeAt(0))>>>0; return AV_COL[h%AV_COL.length]; }
function initials(n){ const p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase(); }
function safePhoto(ph){ return typeof ph==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(ph)?ph:null; }
function avatarHTML(uid,name,status,size,photo){
  const ph=safePhoto(photo!==undefined?photo:(SOC.info[uid]||{}).photo);
  const inner=ph?`<img src="${ph}" alt="">`:`<span style="background:${avColor(uid)}">${esc(initials(name))}</span>`;
  return `<span class="avatar${size?' '+size:''}">${inner}${status?`<i class="st ${status}"></i>`:''}</span>`;
}
const infoLoading=new Set();
function ensureInfo(uid){
  if(!uid||SOC.info[uid]||infoLoading.has(uid)||!FB.db) return;
  infoLoading.add(uid);
  FB.db.ref('users/'+uid).once('value').then(s=>{ SOC.info[uid]=s.val()||{name:'Spieler'}; infoLoading.delete(uid); if(DUEL.view==='lobby') renderOnline(); renderOthersOnline(); }).catch(()=>infoLoading.delete(uid));
}
function avatarFor(uid,name,busy){ ensureInfo(uid); return avatarHTML(uid,name,busy?'busy':'on'); }
function resizePhoto(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const S2=160; const c=document.createElement('canvas'); c.width=c.height=S2; const x=c.getContext('2d');
      const m=Math.min(img.width,img.height); x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S2,S2); res(c.toDataURL('image/jpeg',0.82)); };
      img.onerror=()=>rej(new Error('bild')); img.src=fr.result; };
    fr.onerror=()=>rej(new Error('datei')); fr.readAsDataURL(file);
  });
}
async function savePhoto(dataUrl){
  await FB.db.ref('users/'+FB.user.uid+'/photo').set(dataUrl||null);
  SOC.profile.photo=dataUrl||null; SOC.info[FB.user.uid]=SOC.profile; setProfileIcon(safePhoto(dataUrl));
}

/* ----- Suche nach Namen oder Code ----- */
async function searchUsers(q){
  q=(q||'').trim(); if(q.length<2) return [];
  const out=new Map();
  const code=q.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length===6){ try{ const id=(await FB.db.ref('codes/'+code).once('value')).val(); if(id){ const u=(await FB.db.ref('users/'+id).once('value')).val(); if(u) out.set(id,u); } }catch(e){} }
  const lq=lowerDe(q);
  try{ const snap=await FB.db.ref('users').orderByChild('nameLower').startAt(lq).endAt(lq+'').limitToFirst(15).once('value'); const v=snap.val()||{}; Object.keys(v).forEach(id=>out.set(id,v[id])); }catch(e){}
  out.delete(FB.user.uid);
  return [...out.entries()].map(([id,u])=>{ SOC.info[id]=u; return {id,u}; });
}

/* ----- Profilseite ----- */
async function openProfile(){
  PLATFORM.afterAuth='profile';
  if(!(await PLATFORM.ensureAuth())) return;
  PLATFORM.afterAuth=null;
  initLobby();
  renderProfile();
}
function renderOthersOnline(){
  const box=document.getElementById('othersOnline'); if(!box) return;
  const ps=lobbyPeers().filter(p=>!isFriend(p.by)); const seen=new Set();
  const list=ps.filter(p=>{ if(seen.has(p.by)) return false; seen.add(p.by); return true; });
  if(!list.length){ box.innerHTML='<div class="row"><span class="label"><span>Gerade ist sonst niemand online.</span></span></div>'; return; }
  box.innerHTML=list.map(p=>`<div class="row">${avatarFor(p.by,p.presence.nick,p.presence.busy)}<span class="label"><span>${esc(p.presence.nick||'Spieler')}</span><small>${p.presence.busy?'im Duell':'online'}</small></span><button class="iconbtn addf" data-addp="${esc(p.by)}" aria-label="Als Freund hinzufügen" title="Als Freund hinzufügen">+</button>${p.presence.busy?'':`<button class="btn tinted small" data-chp="${esc(p.peer)}">Herausfordern</button>`}</div>`).join('');
  box.querySelectorAll('[data-addp]').forEach(b=>b.onclick=async()=>{ b.disabled=true; await addFriendUid(b.dataset.addp); });
  box.querySelectorAll('[data-chp]').forEach(b=>b.onclick=()=>{ const p=lobbyPeers().find(x=>x.peer===b.dataset.chp); if(p) hostDuel(newCode(),p); });
}
function renderProfile(msg){
  if(!SOC.profile){ openProfile(); return; }
  stopRec(); S.phase='duel'; DUEL.view='profile'; setBack('Start',renderStart);
  const p=SOC.profile; const st=Object.assign(emptyStats(),p.stats||{});
  view.innerHTML=`<div class="stack">
    <section class="center" style="display:flex;flex-direction:column;align-items:center;gap:10px">
      ${avatarHTML(FB.user.uid,p.name,null,'xl',p.photo||null)}
      <div class="btnrow" style="justify-content:center;flex-wrap:wrap">
        <label class="btn tinted small" for="photoIn">${p.photo?'Foto ändern':'Profilbild hinzufügen'}</label>
        ${p.photo?'<button class="btn plain small" id="photoRm">Entfernen</button>':''}
      </div>
      <input type="file" id="photoIn" accept="image/*" hidden>
      <p class="hint" id="photoHint" role="status"></p>
    </section>
    <section class="stack-sm"><label class="group-label" style="margin:0 0 0 16px" for="pName">Dein Name</label><input id="pName" class="field" maxlength="24" value="${esc(p.name)}" autocomplete="nickname"></section>
    <section class="group list">
      <div class="row"><span class="label"><small>Dein Freundescode</small><b class="fcode">${esc(p.code||'…')}</b></span><button class="btn tinted small" id="copyCode">Kopieren</button></div>
      <div class="row"><span class="label">Ranglistenpunkte</span><span class="value"><b>${st.wins*3+st.draws}</b></span></div>
      <div class="row"><span class="label">Duelle · Siege</span><span class="value">${st.games} · ${st.wins}</span></div>
    </section>

    <p class="group-label">Freunde finden</p>
    <section class="card">
      <input id="fSearch" class="field" style="background:var(--fill);box-shadow:none" type="search" placeholder="Name oder Freundescode" aria-label="Freunde suchen" autocomplete="off">
      <div class="list" id="fResults"></div>
    </section>

    <p class="group-label">Deine Freunde</p>
    <section class="group list" id="friendList"></section>

    <p class="group-label">Gerade online</p>
    <section class="group list" id="othersOnline"></section>

    <section class="group"><button class="row" id="lbRow2"><span class="label">Rangliste</span>${IC.chev}</button></section>
    ${PLATFORM.accountRow()}
    <p class="hint" id="lobbyHint" role="status"></p>
  </div>`;
  if(msg){ const h=document.getElementById('lobbyHint'); h.textContent=msg; }
  const pi=document.getElementById('photoIn'), ph=document.getElementById('photoHint');
  pi.onchange=async()=>{ const f=pi.files&&pi.files[0]; if(!f) return; ph.textContent='Wird gespeichert …'; ph.classList.remove('warn');
    try{ const d=await resizePhoto(f); await savePhoto(d); renderProfile('Profilbild gespeichert.'); }catch(e){ ph.textContent='Dieses Bild konnte nicht gelesen werden. Versuch ein JPG oder PNG.'; ph.classList.add('warn'); } };
  const rm=document.getElementById('photoRm'); if(rm) rm.onclick=async()=>{ await savePhoto(null); renderProfile('Profilbild entfernt.'); };
  const pn=document.getElementById('pName'); let t=null;
  pn.oninput=()=>{ clearTimeout(t); t=setTimeout(async()=>{ const n=pn.value.trim(); if(!n) return; DUEL.nick=n; lsSet('mt-nick',n); pushLobby(); await syncName(n); },600); };
  document.getElementById('copyCode').onclick=async()=>{ const h=document.getElementById('lobbyHint'); try{ await navigator.clipboard.writeText(p.code); h.textContent='Freundescode kopiert.'; }catch(e){ h.textContent='Dein Code: '+p.code; } };
  const fs=document.getElementById('fSearch'), fr=document.getElementById('fResults'); let st2=null, seq=0;
  fs.oninput=()=>{ clearTimeout(st2); const q=fs.value; if(q.trim().length<2){ fr.innerHTML=''; return; }
    st2=setTimeout(async()=>{ const my=++seq; fr.innerHTML='<div class="row"><span class="label"><small>Suche …</small></span></div>'; const res=await searchUsers(q); if(my!==seq) return;
      if(!res.length){ fr.innerHTML='<div class="row"><span class="label"><small>Niemand gefunden. Prüf die Schreibweise oder frag nach dem Freundescode.</small></span></div>'; return; }
      fr.innerHTML=res.map(({id,u})=>`<div class="row">${avatarHTML(id,u.name,null,'',u.photo||null)}<span class="label"><span>${esc(u.name||'Spieler')}</span><small>${(u.stats&&u.stats.games)||0} Duelle</small></span>${isFriend(id)?'<span class="value">Freund</span>':`<button class="btn tinted small" data-addr="${esc(id)}">Hinzufügen</button>`}</div>`).join('');
      fr.querySelectorAll('[data-addr]').forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await addFriendUid(b.dataset.addr); b.outerHTML='<span class="value">Freund</span>'; }catch(e){ b.disabled=false; } });
    },350); };
  document.getElementById('lbRow2').onclick=()=>renderLeaderboard('all');
  PLATFORM.bindAccount();
  renderFriendList(); renderOthersOnline();
  window.scrollTo({top:0});
}
renderStart();
</script>
