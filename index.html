/* ---------- Textwerkzeuge ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lowerDe(s){ return s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,''); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pickOne=a=>a[Math.floor(Math.random()*a.length)];

/* Eintrag aus den Muskeldaten zerlegen: "! Hinweis" bzw. "Anteil :: Text" */
function parseItem(s){
  const note=s.startsWith('!'); const body=note?s.slice(1).trim():s;
  const k=body.indexOf(' :: ');
  return {note, label:k>=0?body.slice(0,k):'', text:k>=0?body.slice(k+4):body};
}

/* Kennwörter eines Textes, um ähnliche Antworten zu erkennen.
   Ohne Füllwörter, Zahlen, Zahlwörter und Klammerzusätze. */
const STOPWORDS=new Set(('der die das des dem den ein eine einer eines einem und oder sowie sowohl auch als am an im in ins von vom zur zum zu bei mit bis ueber auf aus nach '
  +'dabei daher gleicher gleiche teilweise gelegentlich jeweils gesamter gesamte muskel alle aller saemtlicher teil entspringen inserieren verlaufen verlaeuft ausnahme '
  +'proc procc lig musculus musculi nervus nervi processus ligamentum ramus rami ihr ihrer seines seiner sich ist wird the').split(' '));
const NUMBER_WORDS=new Set('eins zwei drei vier fuenf sechs sieben acht neun zehn elf zwoelf iii vii viii'.split(' '));
const ORDINALS=/^(erst|zweit|dritt|viert|fuenft|sechst|siebent|siebt|acht|neunt|zehnt|elft|zwoelft)(e|en|er|es|em|n|r|s)?$/;
function keyWords(text){
  const plain=text.replace(/\([^()]*\)/g,' ');
  return new Set(lowerDe(plain).split(/[^a-z0-9]+/)
    .filter(t=>t.length>=3&&!/\d/.test(t)&&!STOPWORDS.has(t)&&!NUMBER_WORDS.has(t)&&!ORDINALS.test(t)));
}

/* ---------- Vorlesen (Einstellung „Fragen vorlesen“) ---------- */
const synth=window.speechSynthesis||null;
let deVoice=null, autoRead=false;
function pickVoice(){ if(!synth) return; const v=synth.getVoices(); deVoice=v.find(x=>/^de(-|_)DE/i.test(x.lang))||v.find(x=>/^de/i.test(x.lang))||null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }

/* Abkürzungen ausschreiben, damit die Sprachausgabe sie richtig ausspricht */
function ttsText(s){
  return s.replace(/^!\s*/,'').replace(/\bMm\./g,'Musculi').replace(/\bM\./g,'Musculus').replace(/\bNn\./g,'Nervi').replace(/\bN\./g,'Nervus')
   .replace(/\bProcc\./g,'Processus').replace(/\bProc\./g,'Processus').replace(/\bLig\./g,'Ligamentum').replace(/\bRr\./g,'Rami').replace(/\bR\./g,'Ramus')
   .replace(/\bn\. radialis/g,'nervi radialis').replace(/\bu\./g,'und').replace(/HWS/g,'Halswirbelsäule').replace(/BWS/g,'Brustwirbelsäule').replace(/LWS/g,'Lendenwirbelsäule')
   .replace(/\bTh(\d)/g,'T $1').replace(/\b([CLS])(\d)/g,'$1 $2').replace(/–/g,' bis ').replace(/ :: /g,': ').replace(/[„“]/g,'');
}
function speak(text){
  if(!synth) return;
  try{ synth.cancel(); const u=new SpeechSynthesisUtterance(ttsText(text)); u.lang='de-DE'; if(deVoice) u.voice=deVoice; u.rate=0.95; synth.speak(u); }catch(e){}
}
function stopSpeaking(){ if(synth) synth.cancel(); }

/* ---------- Fragen: kurz, 4 Antworten, genau eine richtig ----------
   Vorwärts (t:'f'): Muskel gegeben, richtigen Ursprung/Ansatz/… wählen. Optionen: [Muskel-ID, Eintrag-Index]
   Rückwärts (t:'r'): Fakt gegeben, richtigen Muskel wählen. Optionen: Muskel-IDs */
const QF=['U','A','F','I'];
const NOPT=4;
const MOVEMENTS='flexion extension abduktion adduktion innenrotation aussenrotation pronation supination anteversion retroversion dorsalextension plantarflexion palmarflexion inversion eversion lateralflexion rotation elevation inspiration exspiration spreizen opposition radialabduktion ulnarabduktion semipronation'.split(' ');

function realItems(m,k){ return (m[k]||[]).map((s,i)=>Object.assign({i},parseItem(s))).filter(x=>!x.note); }
function qFields(m){ return QF.filter(k=>realItems(m,k).length); }
function jaccard(a,b){ let n=0; a.forEach(x=>{ if(b.has(x)) n++; }); const u=a.size+b.size-n; return u?n/u:0; }
function movements(text){ const t=lowerDe(text); return new Set(MOVEMENTS.filter(w=>t.includes(w))); }
const normLabel=l=>lowerDe(l||'').replace(/[^a-z]/g,'');
const isJoint=l=>/gelenk|wirbelsaeule|hws|bws|lws|kopf/.test(lowerDe(l||''));

/* Wäre ein Kandidat für Muskel m in Feld k womöglich auch richtig? Dann taugt er nicht als falsche Antwort. */
function conflicts(m,k,ctext,clabel){
  const ck=keyWords(ctext);
  const fields=(k==='U'||k==='A')?['U','A','UA']:[k];
  for(const f of fields) for(const x of realItems(m,f)) if(jaccard(ck,keyWords(x.text))>=0.5) return true;
  if(k==='F'){
    const cm=movements(ctext); if(!cm.size) return true;
    for(const x of realItems(m,'F')){
      const sameJoint=!(isJoint(clabel)&&isJoint(x.label)&&normLabel(clabel)!==normLabel(x.label));
      const xm=movements(x.text);
      if(sameJoint&&[...cm].some(v=>xm.has(v))) return true;
    }
  }
  return false;
}
function forwardQ(m,k){
  const items=realItems(m,k); if(!items.length) return null;
  const short=items.filter(x=>x.text.length<=110);
  const it=pickOne(short.length?short:items), len=it.text.length;
  /* Ähnlich lange Einträge aus derselben Region bevorzugen, damit die Länge nichts verrät */
  const pool=[];
  M.forEach(o=>{ if(o.id===m.id) return; realItems(o,k).forEach(x=>pool.push({m:o.id,i:x.i,text:x.text,label:x.label,
    score:Math.abs(x.text.length-len)/Math.max(len,20)+(o.r===m.r?0:0.35)+(it.label&&normLabel(x.label)===normLabel(it.label)?-0.3:0)+Math.random()*0.5})); });
  pool.sort((a,b)=>a.score-b.score);
  const picks=[], seen=[keyWords(it.text)];
  for(const c of pool){
    if(picks.length>=NOPT-1) break;
    if(conflicts(m,k,c.text,c.label)) continue;
    const ck=keyWords(c.text);
    if(!ck.size||seen.some(s=>jaccard(s,ck)>=0.4||[...ck].filter(x=>s.has(x)).length>=Math.min(3,ck.size))) continue;
    seen.push(ck); picks.push([c.m,c.i]);
  }
  if(picks.length<NOPT-1) return null;
  return {t:'f',m:m.id,k,i:it.i,o:shuffle([[m.id,it.i],...picks])};
}
function reverseQ(m,k){
  if(k==='F') return null;
  const items=realItems(m,k).filter(x=>!x.label&&x.text.length<=110); if(!items.length) return null;
  const it=pickOne(items), ik=keyWords(it.text);
  const alsoTrue=(o,f)=>realItems(o,f).some(x=>jaccard(ik,keyWords(x.text))>=0.5);
  const ok=o=>o.id!==m.id&&!alsoTrue(o,k)&&!(k!=='I'&&alsoTrue(o,k==='U'?'A':'U'));
  const same=shuffle(M.filter(o=>o.r===m.r&&ok(o))), other=shuffle(M.filter(o=>o.r!==m.r&&ok(o)));
  const picks=[...same.slice(0,2),...other,...same.slice(2)].slice(0,NOPT-1).map(o=>o.id);
  if(picks.length<NOPT-1) return null;
  return {t:'r',m:m.id,k,i:it.i,o:shuffle([m.id,...picks])};
}
function makeQuestion(mid,k){
  const m=M[mid];
  return (Math.random()<0.35&&reverseQ(m,k))||forwardQ(m,k)||reverseQ(m,k);
}

/* ----- Darstellung ----- */
const QTXT={
  f:{U:'Wo entspringt der Muskel?',A:'Wo setzt der Muskel an?',F:'Welche Funktion hat der Muskel?',I:'Welcher Nerv innerviert den Muskel?'},
  fp:{U:'Wo entspringt dieser Anteil?',A:'Wo setzt dieser Anteil an?',I:'Welcher Nerv innerviert diesen Anteil?'},
  r:{U:'Welcher Muskel entspringt hier?',A:'Welcher Muskel setzt hier an?',I:'Welcher Muskel wird von diesem Nerv innerviert?'}
};
function qItem(q){ return parseItem(M[q.m][q.k][q.i]); }
function qPinned(q){ return q.t==='f'&&q.k!=='F'&&!!qItem(q).label; }   // Frage nach einem bestimmten Anteil
function qText(q){ return q.t==='r'?QTXT.r[q.k]:(qPinned(q)?QTXT.fp[q.k]:QTXT.f[q.k]); }
function qSpeak(q){ return q.t==='r'?qText(q)+' '+qItem(q).text:M[q.m].n+'. '+qText(q); }
function correctKey(q){ return q.t==='f'?q.m+':'+q.i:String(q.m); }
function optList(q){
  if(q.t==='r') return q.o.map(id=>({key:String(id),text:M[id].n}));
  return q.o.map(([mid,i])=>{ const it=parseItem(M[mid][q.k][i]); return {key:mid+':'+i,text:(q.k==='F'&&it.label?it.label+': ':'')+it.text}; });
}
function qCardHTML(q,showName){
  const it=qItem(q);
  if(q.t==='r'&&!showName) return `<article class="card qcard"><span class="pill">${FIELD[q.k]}</span><p class="fact">${esc(it.text)}</p></article>`;
  return `<article class="card qcard">
    <div class="pills"><span class="pill">${FIELD[q.k]}</span>${qPinned(q)?`<span class="pill neutral">${esc(it.label)}</span>`:''}</div>
    <h2 class="title-xl">${nameHTML(M[q.m].n)}</h2>
    ${q.t==='r'?`<p class="sub">${esc(it.text)}</p>`:''}
  </article>`;
}
/* state: reveal (Lösung zeigen), mine (eigene Wahl), theirs/theirName (Wahl des Gegners), locked */
function optionsHTML(q,state){
  const st=state||{}, corr=correctKey(q);
  return `<div class="opts" role="list">${optList(q).map((o,idx)=>{
    let c='opt'; const tags=[];
    if(st.reveal){ c+=o.key===corr?' right':o.key===st.mine?' wrong':' dim'; }
    else if(st.mine!=null){ c+=o.key===st.mine?' picked':' dim'; }
    if(st.reveal&&o.key===st.mine) tags.push('Du');
    if(st.reveal&&st.theirs!=null&&o.key===st.theirs) tags.push(esc(st.theirName||'Gegner'));
    return `<button class="${c}" role="listitem" data-opt="${o.key}" ${st.locked?'disabled':''}><span class="optl">${'ABCD'[idx]}</span><span class="optt">${esc(o.text)}</span>${tags.length?`<span class="opttag">${tags.join(' · ')}</span>`:''}</button>`;
  }).join('')}</div>`;
}

/* ---------- Lernmodus: 20 Fragen aus der gewählten Auswahl ---------- */
const ROUND_LEN=20;
const S={regions:new Set(Object.keys(REG)), cats:new Set(QF), regOpen:false, phase:'start', queue:[], qi:0, right:0, results:{}};
function fieldsFor(m){ return qFields(m).filter(k=>S.cats.has(k)); }
function selected(){ return M.filter(m=>S.regions.has(m.r)&&fieldsFor(m).length); }

function startQuiz(){
  const qs=[];
  selected().forEach(m=>fieldsFor(m).forEach(k=>{ const q=makeQuestion(m.id,k); if(q) qs.push(q); }));
  S.queue=shuffle(qs).slice(0,ROUND_LEN); S.qi=0; S.results={}; S.right=0;
  if(S.queue.length) renderAsk(); else renderStart();
}
function progressHTML(){
  return `<div class="progress"><span>Frage ${S.qi+1} von ${S.queue.length}</span><div class="track"><span style="width:${S.qi/S.queue.length*100}%"></span></div><span>${S.right} ✓</span></div>`;
}
function renderAsk(){
  S.phase='ask';
  const q=S.queue[S.qi];
  setBack('Beenden',()=>{ stopSpeaking(); renderEnd(); });
  showPage(`<div class="stack">${progressHTML()}
    ${qCardHTML(q,false)}
    <section class="stack-sm">
      <p class="question">${esc(qText(q))}</p>
      ${optionsHTML(q)}
    </section>
    <button class="btn plain" id="dunno">Weiß ich nicht</button>
  </div>`);
  view.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>showResult(b.dataset.opt));
  view.querySelector('#dunno').onclick=()=>showResult(null);
  if(autoRead) speak(qSpeak(q));
}
function solutionHTML(items){
  return items.map(s=>{ const it=parseItem(s); return it.note?`<li class="note">${esc(it.text)}</li>`:`<li>${it.label?`<b>${esc(it.label)}:</b> `:''}${esc(it.text)}</li>`; }).join('');
}
function figHTML(m){
  const f=IMG[m.n]; if(!f) return '';
  return `<figure class="fig"><button class="figbtn" aria-label="Abbildung vergrößern"><img src="img/${f[0]}.webp" alt="Abbildung ${esc(m.n)} aus dem Skript"></button><figcaption>${f[1]?'In der Abbildung: '+esc(f[1]):'Abbildung aus deinem Skript'} · zum Vergrößern antippen</figcaption></figure>`;
}
function bindFigure(){ const fb=view.querySelector('.figbtn'); if(fb) fb.onclick=()=>fb.closest('.fig').classList.toggle('big'); }
function showResult(choice){
  stopSpeaking(); S.phase='result';
  const q=S.queue[S.qi], m=M[q.m];
  const ok=choice===correctKey(q); if(ok) S.right++;
  (S.results[m.id]=S.results[m.id]||{})[q.k]=ok;
  const verdict=choice==null?'Hier ist die Lösung':ok?'Richtig!':'Leider falsch';
  const last=S.qi===S.queue.length-1;
  showPage(`<div class="stack">${progressHTML()}
    ${qCardHTML(q,true)}
    <section class="stack-sm">
      <div class="verdict v-${ok?'good':'bad'}"><span class="vicon">${ok?IC.ok:IC.bad}</span><div><b>${verdict}</b><span>${esc(qText(q))}</span></div></div>
      ${optionsHTML(q,{reveal:true,mine:choice,locked:true})}
    </section>
    <details class="card more"${ok?'':' open'}><summary>Alles zu ${esc(FIELD[q.k])} · ${esc(m.n)}</summary>
      <ul class="sol">${solutionHTML(m[q.k])}</ul>
      ${figHTML(m)}
      ${autoRead?`<div class="btnrow"><button class="btn tinted small" id="readSol">${IC.speaker}Vorlesen</button></div>`:''}
    </details>
    <button class="btn primary" id="next">${last?'Ergebnis ansehen':'Weiter'}</button>
  </div>`);
  bindFigure();
  const rs=view.querySelector('#readSol');
  if(rs) rs.onclick=()=>speak(FIELD[q.k]+'. '+m[q.k].map(s=>{ const it=parseItem(s); return (it.label?it.label+': ':'')+it.text; }).join('. '));
  view.querySelector('#next').onclick=()=>{ stopSpeaking(); if(last) renderEnd(); else { S.qi++; renderAsk(); } };
  if(autoRead) speak(verdict);
}
function renderEnd(){
  S.phase='end'; setBack('Start',renderStart);
  const ids=Object.keys(S.results).map(Number);
  const answered=ids.reduce((a,id)=>a+Object.keys(S.results[id]).length,0);
  const rows=ids.map(id=>{ const r=S.results[id];
    return `<div class="row"><span class="label">${esc(M[id].n)}</span><span class="badges">${QF.filter(k=>k in r).map(k=>`<span class="badge ${r[k]?'good':'bad'}">${FIELD[k]} ${r[k]?'✓':'✗'}</span>`).join('')}</span></div>`; }).join('');
  showPage(`<div class="stack">
    <div class="pagehead"><h2 class="pagetitle">Durchgang beendet</h2><p class="sub">${answered?`${S.right} von ${answered} Fragen richtig`:'Keine Fragen beantwortet'}</p></div>
    ${rows?`<section class="group list">${rows}</section>`:''}
    <div class="stack-sm"><button class="btn primary" id="again">Neue Runde mit gleicher Auswahl</button><button class="btn plain" id="back">Zur Auswahl</button></div>
  </div>`);
  view.querySelector('#again').onclick=startQuiz;
  view.querySelector('#back').onclick=renderStart;
}

function regionValue(){ const n=S.regions.size, all=Object.keys(REG).length; return n===all?'Alle':n===0?'Keine':`${n} von ${all}`; }
function renderStart(){
  S.phase='start'; setBack(null);
  leaveOnline();
  const counts={}; M.forEach(m=>counts[m.r]=(counts[m.r]||0)+1);
  const n=selected().length;
  const regRows=Object.keys(REG).map(r=>`<button class="row" role="menuitemcheckbox" data-reg="${r}" aria-checked="${S.regions.has(r)}"><span class="label">${esc(REG[r])}</span><span class="count">${counts[r]}</span>${IC.check}</button>`).join('');
  const catRows=QF.map(k=>`<button class="row" role="switch" data-cat="${k}" aria-checked="${S.cats.has(k)}"><span class="label">${FIELD[k]}</span><span class="switch" aria-hidden="true"></span></button>`).join('');
  view.innerHTML=`<div class="stack">
    <section class="group">
      <button class="row" id="duel"><span class="tile">${IC.bolt}</span><span class="label">Gegen Freunde spielen<small>Duell 1 gegen 1 oder Lobby mit bis zu ${GMAX} Spielern</small></span>${IC.chev}</button>
    </section>

    <p class="group-label">Lernen</p>
    <section class="group">
      <button class="row" id="regRow" aria-expanded="${S.regOpen}" aria-controls="regList"><span class="label">Regionen</span><span class="value">${regionValue()}</span>${IC.chev}</button>
      <div class="sublist" id="regList" ${S.regOpen?'':'hidden'}>${regRows}
        <div class="tools"><button class="link" id="regAll">Alle auswählen</button><button class="link" id="regNone">Keine</button></div></div>
    </section>

    <p class="group-label">Abfragen</p>
    <section class="group">${catRows}</section>

    <div class="stack-sm">
      <button class="btn primary" id="go" ${n?'':'disabled'}>Abfrage starten</button>
      <p class="footnote">${n} ${n===1?'Muskel':'Muskeln'} ausgewählt · ${ROUND_LEN} Fragen pro Runde</p>
    </div>
  </div>`;
  const rerender=()=>{ const y=window.scrollY; renderStart(); window.scrollTo(0,y); };
  view.querySelector('#regRow').onclick=()=>{ S.regOpen=!S.regOpen; rerender(); };
  view.querySelectorAll('[data-reg]').forEach(b=>b.onclick=()=>{ const r=b.dataset.reg; S.regions.has(r)?S.regions.delete(r):S.regions.add(r); rerender(); });
  view.querySelector('#regAll').onclick=()=>{ Object.keys(REG).forEach(r=>S.regions.add(r)); rerender(); };
  view.querySelector('#regNone').onclick=()=>{ S.regions.clear(); rerender(); };
  view.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ const k=b.dataset.cat; if(S.cats.has(k)&&S.cats.size===1) return; S.cats.has(k)?S.cats.delete(k):S.cats.add(k); rerender(); });
  view.querySelector('#go').onclick=startQuiz;
  view.querySelector('#duel').onclick=()=>{ stopSpeaking(); openDuel(); };
}

/* ---------- Firebase: wird erst geladen, wenn jemand online spielen will ---------- */
const FB_VER='10.12.2';
const FB={app:null,auth:null,db:null,user:null,loading:null};

function loadScript(src){
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.async=true; s.onload=res; s.onerror=()=>rej(new Error('load')); document.head.appendChild(s); });
}
function fbConfigured(){ const c=window.FIREBASE_CONFIG; return !!(c&&c.apiKey&&c.databaseURL); }
async function loadFirebase(){
  if(FB.loading) return FB.loading;
  FB.loading=(async()=>{
    const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    await loadScript(base+'firebase-app-compat.js');
    await Promise.all([loadScript(base+'firebase-auth-compat.js'),loadScript(base+'firebase-database-compat.js')]);
    FB.app=firebase.initializeApp(window.FIREBASE_CONFIG);
    FB.auth=firebase.auth(); FB.db=firebase.database();
    await new Promise(res=>FB.auth.onAuthStateChanged(u=>{ FB.user=u; res(); }));
  })();
  FB.loading.catch(()=>{ FB.loading=null; });
  return FB.loading;
}

/* Raum = Pfad in der Datenbank. Jeder Spieler schreibt nur seinen eigenen Eintrag ("presence")
   und sieht die Einträge aller anderen ("peers"). Beim Verbindungsabbruch wird der Eintrag gelöscht.
   Genutzt für die Lobby ("lobby"), Duelle ("rooms/duel-1234") und Gruppen ("rooms/grp-12345"). */
function fbRoom(path){
  const uid=FB.user.uid, ref=FB.db.ref(path), mine=ref.child(uid);
  let peers=Object.freeze([]), cur={}, disc=false, alive=true;
  const handlers=new Set(), errHandlers=new Set();
  const onValue=s=>{
    const v=s.val()||{};
    peers=Object.freeze(Object.keys(v).map(k=>Object.freeze({peer:k,by:k,isMe:k===uid,presence:v[k]||{}})));
    handlers.forEach(h=>{ try{ h(); }catch(e){ console.error(e); } });
  };
  ref.on('value',onValue,()=>errHandlers.forEach(e=>e()));
  return {
    peers:()=>peers,
    onPeers(h,e){ handlers.add(h); if(e) errHandlers.add(e); setTimeout(()=>{ if(alive&&handlers.has(h)) h(); },0); return ()=>{ handlers.delete(h); if(e) errHandlers.delete(e); }; },
    presence(patch){
      if(!alive) return Promise.resolve();
      const n={...cur}; for(const k in patch){ if(patch[k]==null) delete n[k]; else n[k]=JSON.parse(JSON.stringify(patch[k])); }
      cur=n; if(!disc){ disc=true; mine.onDisconnect().remove(); }
      return mine.set(cur);
    },
    leave(){ alive=false; ref.off('value',onValue); handlers.clear(); errHandlers.clear(); mine.onDisconnect().cancel(); return mine.remove(); },
    join:name=>Promise.resolve(fbRoom('rooms/'+name))
  };
}

/* Sorgt für eine Anmeldung. Gibt false zurück, wenn stattdessen eine Anmelde- oder Hinweisseite gezeigt wird. */
async function ensureAuth(next){
  authNext=next||'duel';

    renderOnlineNote(null);
    try{ await loadFirebase(); }catch(e){ renderOnlineNote('Die Verbindung zum Server hat nicht geklappt. Prüfe dein Internet und versuch es nochmal.'); return false; }

  }

/* ---------- Profile, Freunde, Statistik (Firebase-Daten) ----------
   users/{uid}:   {name, nameLower, code, photo, stats:{games,wins,losses,draws,points}, score, lastGid}
   codes/{CODE}:  uid (6-stelliger Freundescode)
   friends/{uid}/{fid}: true (beidseitig)
   h2h/{uid1_uid2}: Bilanz zweier Spieler {games, d, w:{uid:n}, pts:{uid:n}, last, lastGid} */
const SOC={profile:null,friends:{},info:{},h2h:{},listening:false};
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const pairKey=(a,b)=>[a,b].sort().join('_');
const emptyStats=()=>({games:0,wins:0,losses:0,draws:0,points:0});
const scoreOf=st=>st.wins*3+st.draws;   // Rangliste: Sieg 3, Unentschieden 1
const userRef=uid=>FB.db.ref('users/'+uid);

function resetSocial(){
  try{ FB.db.ref('friends/'+FB.user.uid).off(); }catch(e){}
  Object.assign(SOC,{profile:null,friends:{},info:{},h2h:{},listening:false});
}
/* Profil laden bzw. beim ersten Mal anlegen (mit Freundescode und Suchnamen) */
async function ensureProfile(){
  const u=FB.user; if(!u) return null;
  const p=(await userRef(u.uid).once('value')).val()||{};
  for(let t=0;t<6&&!p.code;t++){
    let c=''; for(let i=0;i<6;i++) c+=pickOne(CODE_CHARS);
    try{ await FB.db.ref('codes/'+c).set(u.uid); p.code=c; }catch(e){}   // Regel verhindert doppelte Codes
  }
  p.name=p.name||u.displayName||'Spieler';
  p.nameLower=lowerDe(p.name).trim();
  p.stats=Object.assign(emptyStats(),p.stats||{});
  p.score=scoreOf(p.stats);
  await userRef(u.uid).set(p);
  SOC.profile=p; SOC.info[u.uid]=p; setProfileIcon(safePhoto(p.photo));
  if(!SOC.listening){
    SOC.listening=true;
    FB.db.ref('friends/'+u.uid).on('value',s=>{ SOC.friends=s.val()||{}; loadFriendData(); });
  }
  return p;
}
async function loadFriendData(){
  const me=FB.user&&FB.user.uid; if(!me) return;
  await Promise.all(Object.keys(SOC.friends).map(async fid=>{
    try{ SOC.info[fid]=(await userRef(fid).once('value')).val()||{name:'Spieler'}; }catch(e){ SOC.info[fid]=SOC.info[fid]||{name:'Spieler'}; }
    try{ SOC.h2h[fid]=(await FB.db.ref('h2h/'+pairKey(me,fid)).once('value')).val(); }catch(e){}
  }));
  refreshPeople();
}
const isFriend=uid=>!!(uid&&SOC.friends[uid]);
/* Bilanz gegen einen Freund aus meiner Sicht */
function record(fid){
  const me=FB.user.uid, h=SOC.h2h[fid];
  if(!h) return {games:0,w:0,l:0,d:0,pm:0,pf:0,last:null};
  return {games:h.games||0,w:(h.w||{})[me]||0,l:(h.w||{})[fid]||0,d:h.d||0,pm:(h.pts||{})[me]||0,pf:(h.pts||{})[fid]||0,last:h.last||null};
}
async function addFriend(fid){
  const me=FB.user.uid; if(!fid||fid===me) return;
  await FB.db.ref('friends/'+me+'/'+fid).set(true);
  await FB.db.ref('friends/'+fid+'/'+me).set(true);
}
async function removeFriend(fid){
  const me=FB.user.uid;
  await FB.db.ref('friends/'+me+'/'+fid).remove();
  try{ await FB.db.ref('friends/'+fid+'/'+me).remove(); }catch(e){}
  delete SOC.info[fid];
}
async function saveName(n){
  n=(n||'').trim().slice(0,24); if(!FB.user||!SOC.profile||!n) return;
  try{ await userRef(FB.user.uid).update({name:n,nameLower:lowerDe(n)}); SOC.profile.name=n; pushLobby(); }catch(e){}
}

/* Ergebnis eines Duells speichern: jeder seine eigene Statistik, der Gastgeber die gemeinsame Bilanz.
   lastGid verhindert, dass ein Spiel doppelt zählt. */
async function saveGameResult(r){
  const me=FB.user&&FB.user.uid; if(!me) return;
  const res=r.me>r.them?'wins':r.me<r.them?'losses':'draws';
  try{
    await userRef(me).transaction(p=>{
      p=p||{}; p.stats=Object.assign(emptyStats(),p.stats||{});
      if(p.lastGid===r.gid) return p;
      p.stats.games++; p.stats[res]++; p.stats.points+=r.me; p.lastGid=r.gid;
      p.score=scoreOf(p.stats); p.name=p.name||myName(); return p;
    });
  }catch(e){}
  if(r.host&&r.opp){
    try{
      await FB.db.ref('h2h/'+pairKey(me,r.opp)).transaction(h=>{
        h=h||{games:0,d:0,w:{},pts:{}};
        if(h.lastGid===r.gid) return h;
        h.w=h.w||{}; h.pts=h.pts||{}; h.games=(h.games||0)+1;
        if(r.me>r.them) h.w[me]=(h.w[me]||0)+1; else if(r.me<r.them) h.w[r.opp]=(h.w[r.opp]||0)+1; else h.d=(h.d||0)+1;
        h.pts[me]=(h.pts[me]||0)+r.me; h.pts[r.opp]=(h.pts[r.opp]||0)+r.them;
        h.last=Date.now(); h.lastGid=r.gid; return h;
      });
    }catch(e){}
  }
  try{ await ensureProfile(); }catch(e){}
  if(r.opp) try{ SOC.h2h[r.opp]=(await FB.db.ref('h2h/'+pairKey(me,r.opp)).once('value')).val(); }catch(e){}
  const rc=r.opp?record(r.opp):null, el=document.getElementById('h2hLine');
  if(el&&rc&&rc.games) el.textContent=`Bilanz gegen ${oppName()}: ${rc.w} : ${rc.l}${rc.d?` (${rc.d} unentschieden)`:''}`;
}

/* ----- Profilbilder ----- */
const AV_COLORS=['#E0453A','#F08A24','#2F9E5B','#1F8FBF','#5B5BD6','#B24FC9','#D94C86','#7A8B99'];
function avColor(uid){ let h=0; for(const c of String(uid||'x')) h=(h*31+c.charCodeAt(0))>>>0; return AV_COLORS[h%AV_COLORS.length]; }
function initials(n){ const p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase(); }
/* Nur echte Bild-Daten-URLs zulassen (die Bilder kommen von anderen Spielern) */
function safePhoto(ph){ return typeof ph==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(ph)?ph:null; }
/* status: on | busy | off | null; size: '' | 'xl'; photo: undefined = aus dem Cache nehmen */
function avatarHTML(uid,name,status,size,photo){
  const ph=safePhoto(photo!==undefined?photo:(SOC.info[uid]||{}).photo);
  const inner=ph?`<img src="${ph}" alt="">`:`<span style="background:${avColor(uid)}">${esc(initials(name))}</span>`;
  return `<span class="avatar${size?' '+size:''}">${inner}${status?`<i class="st ${status}"></i>`:''}</span>`;
}
/* Avatar für jemanden, der online ist; lädt sein Profilbild bei Bedarf nach */
const infoLoading=new Set();
function avatarFor(uid,name,busy){
  if(uid&&!SOC.info[uid]&&!infoLoading.has(uid)&&FB.db){
    infoLoading.add(uid);
    userRef(uid).once('value').then(s=>{ SOC.info[uid]=s.val()||{name:'Spieler'}; refreshPeople(); }).catch(()=>{}).finally(()=>infoLoading.delete(uid));
  }
  return avatarHTML(uid,name,busy?'busy':'on');
}
/* Foto quadratisch zuschneiden und auf 160 px verkleinern (passt so in die Datenbank) */
function resizePhoto(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const size=160, c=document.createElement('canvas'); c.width=c.height=size;
        const m=Math.min(img.width,img.height);
        c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size);
        res(c.toDataURL('image/jpeg',0.82));
      };
      img.onerror=()=>rej(new Error('bild')); img.src=fr.result;
    };
    fr.onerror=()=>rej(new Error('datei')); fr.readAsDataURL(file);
  });
}
async function savePhoto(dataUrl){
  await userRef(FB.user.uid).child('photo').set(dataUrl||null);
  SOC.profile.photo=dataUrl||null; setProfileIcon(safePhoto(dataUrl));
}

/* Spieler suchen: 6-stelliger Freundescode oder Namensanfang */
async function searchUsers(q){
  q=(q||'').trim(); if(q.length<2) return [];
  const found=new Map();
  const code=q.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length===6){
    try{ const id=(await FB.db.ref('codes/'+code).once('value')).val(); if(id){ const u=(await userRef(id).once('value')).val(); if(u) found.set(id,u); } }catch(e){}
  }
  const lq=lowerDe(q);
  try{
    const v=(await FB.db.ref('users').orderByChild('nameLower').startAt(lq).endAt(lq+'').limitToFirst(15).once('value')).val()||{};
    Object.keys(v).forEach(id=>found.set(id,v[id]));
  }catch(e){}
  found.delete(FB.user.uid);
  return [...found.entries()].map(([id,u])=>{ SOC.info[id]=u; return {id,u}; });
}

/* ---------- Lobby: wer ist online, Einladungen, Einstieg in Duell und Gruppe ----------
   Jeder angemeldete Spieler hat in "lobby" einen Eintrag:
   {app:'mt', nick, busy, inv:{to,code} (Duell-Einladung), ginv:{to:[…],code} (Gruppen-Einladung), dec:{to,code} (Absage)}
   DUEL.view sagt, welche Online-Ansicht gerade offen ist (off, note, auth, lobby, wait, game, group, profile, friend, board). */
const DUEL={room:null,loading:null,myPeer:null,view:'off',outInv:null,decline:null,seen:new Set(),
  role:null,code:null,named:null,unsub:[],timers:[],game:null,hg:null,lastKey:null,hist:[],oppNick:'',oppId:null,target:null,reported:null};

const myName=()=>((SOC.profile&&SOC.profile.name)||'Spieler').slice(0,24);

async function initLobby(){
  if(DUEL.room) return true;
  if(!DUEL.loading) DUEL.loading=(async()=>{
    if(!FB.user) return false;
    DUEL.room=fbRoom('lobby'); DUEL.myPeer=FB.user.uid;
    DUEL.room.onPeers(onLobbyPeers);
    pushLobby();
    return true;
  })().finally(()=>{ DUEL.loading=null; });
  return DUEL.loading;
}
async function disconnectLobby(){
  leaveOnline();
  const r=DUEL.room; DUEL.room=null; DUEL.myPeer=null;
  if(r) try{ await r.leave(); }catch(e){}
}
function pushLobby(){
  if(!DUEL.room) return;
  DUEL.room.presence({app:'mt',nick:myName(),busy:inMatch(),inv:DUEL.outInv,ginv:groupInvitePresence(),dec:DUEL.decline}).catch(()=>{});
}
function lobbyPeers(){
  if(!DUEL.room) return [];
  const seen=new Set();
  return DUEL.room.peers().filter(p=>!p.isMe&&p.presence.app==='mt'&&!seen.has(p.by)&&seen.add(p.by));
}
/* Verlässt laufende Online-Ansichten (z. B. beim Wechsel zur Startseite) */
function leaveOnline(){
  if(GRP.named) leaveGroupRoom();
  if(DUEL.named) leaveDuelRoom();
  DUEL.view='off'; pushLobby();
}

function onLobbyPeers(){
  const ps=lobbyPeers();
  if(DUEL.view==='wait'&&DUEL.outInv&&ps.some(p=>p.presence.dec&&p.presence.dec.to===DUEL.myPeer&&p.presence.dec.code===DUEL.outInv.code)){
    leaveDuel('Deine Herausforderung wurde abgelehnt.'); return;
  }
  const duelInv=ps.find(p=>p.presence.inv&&p.presence.inv.to===DUEL.myPeer&&!DUEL.seen.has(p.presence.inv.code));
  const groupInv=ps.find(p=>{ const gi=p.presence.ginv; return gi&&Array.isArray(gi.to)&&gi.to.includes(DUEL.myPeer)&&!DUEL.seen.has('g'+gi.code); });
  showInvite(duelInv,groupInv);
  refreshPeople();
}
/* Listen mit Spielern auf der gerade offenen Seite neu zeichnen */
function refreshPeople(){
  if(DUEL.view==='lobby'){ renderOnlineList('onlineList'); renderFriendList(); }
  if(DUEL.view==='profile'){ renderOnlineList('othersOnline'); renderFriendList(); }
  if(DUEL.view==='group') renderGroupMembers();
}

/* Einladung unten als Sheet einblenden */
function showInvite(duelInv,groupInv){
  if(inMatch()||(!duelInv&&!groupInv)){ inviteBar.hidden=true; return; }
  const p=duelInv||groupInv;
  const code=duelInv?p.presence.inv.code:p.presence.ginv.code, seenKey=duelInv?code:'g'+code;
  inviteBar.innerHTML=`<div class="sheet-in"><p><b>${esc(p.presence.nick||'Jemand')}</b> ${duelInv?'fordert dich zum Duell heraus.':'lädt dich in eine Lobby ein.'}</p><div class="btnrow"><button class="btn plain" id="invNo">Ablehnen</button><button class="btn primary" id="invYes">${duelInv?'Annehmen':'Beitreten'}</button></div></div>`;
  inviteBar.hidden=false;
  inviteBar.querySelector('#invYes').onclick=()=>{ DUEL.seen.add(seenKey); inviteBar.hidden=true; stopSpeaking(); duelInv?joinDuel(code):openGroup(code); };
  inviteBar.querySelector('#invNo').onclick=()=>{
    DUEL.seen.add(seenKey); inviteBar.hidden=true;
    if(!duelInv) return;
    DUEL.decline={to:p.peer,code}; pushLobby();
    setTimeout(()=>{ if(DUEL.decline&&DUEL.decline.code===code){ DUEL.decline=null; pushLobby(); } },15000);
  };
}

/* Spieler online, die (noch) keine Freunde sind: mit „+“ hinzufügen oder herausfordern */
function renderOnlineList(boxId){
  const box=document.getElementById(boxId); if(!box) return;
  const list=lobbyPeers().filter(p=>!isFriend(p.by));
  if(!list.length){ box.innerHTML=infoRow('Gerade ist sonst niemand online.','Schick deinen Freunden den Link zu dieser Seite. Sobald sie angemeldet sind, erscheinen sie hier.'); return; }
  box.innerHTML=list.map(p=>`<div class="row">${avatarFor(p.by,p.presence.nick,p.presence.busy)}<span class="label"><span>${esc(p.presence.nick||'Spieler')}</span><small>${p.presence.busy?'spielt gerade':'online'}</small></span><button class="iconbtn addf" data-addf="${esc(p.by)}" aria-label="Als Freund hinzufügen" title="Als Freund hinzufügen">+</button>${p.presence.busy?'':`<button class="btn tinted small" data-ch="${esc(p.peer)}">Herausfordern</button>`}</div>`).join('');
  box.querySelectorAll('[data-addf]').forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await addFriend(b.dataset.addf); }catch(e){ b.disabled=false; } });
  box.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>challenge(b.dataset.ch));
}
function challenge(peer){ const p=lobbyPeers().find(x=>x.peer===peer); if(p&&!p.presence.busy) hostDuel(newDuelCode(),p); }

/* ---------- Gemeinsamer Rundenablauf für Duell und Gruppe ----------
   Der Gastgeber erzeugt die Fragen und steuert die Phasen (q = Frage, rev = Auflösung, end = Ende).
   Alle anderen folgen seinem Spielstand und melden nur ihre eigene Antwort. */
const ROUNDS=10, QTIME=30000, REVEAL=6000;
const RT={tInt:null,deadline:null,revInt:null,next:null,start:0,myAns:null};

/* Punkte nach Tempo: richtig sofort = 100, kurz vor Ablauf = 10, dazwischen fließend; falsch = 0.
   Wer nachschlägt, verliert Zeit und damit die meisten Punkte. */
const PTS_MAX=100, PTS_MIN=10;
function speedPoints(t){ return Math.round(PTS_MAX-(PTS_MAX-PTS_MIN)*Math.min(Math.max(t,0),QTIME)/QTIME); }
function evalChoice(c,key,t){
  c=typeof c==='string'?c:''; const ok=!!c&&c===key; t=Math.min(Number(t)||QTIME,QTIME);
  return {c,ok,pt:ok?speedPoints(t):0,t};
}
/* 10 Fragen zu 10 verschiedenen Muskeln */
function pickQs(){
  const qs=[];
  for(const m of shuffle(M.slice())){
    if(qs.length>=ROUNDS) break;
    for(const k of shuffle(qFields(m))){ const q=makeQuestion(m.id,k); if(q){ qs.push(q); break; } }
  }
  return qs;
}
function clearRoundTimers(){
  clearInterval(RT.tInt); clearTimeout(RT.deadline); clearInterval(RT.revInt); clearTimeout(RT.next);
  RT.tInt=RT.deadline=RT.revInt=RT.next=null;
}

/* Frage mit 30-Sekunden-Balken zeigen. onLock(antwort) kommt genau einmal: beim Antippen oder wenn die Zeit abläuft. */
function showRoundQuestion(topHTML,g,onLock){
  clearRoundTimers();
  const q=g.qs[g.r];
  RT.myAns=null; RT.start=performance.now();
  showPage(`<div class="stack">${topHTML}
    <div class="tbar" aria-hidden="true"><span id="tfill"></span></div>
    <p class="footnote tleft"><span id="tleft">30</span> Sekunden</p>
    ${qCardHTML(q,false)}
    <section class="stack-sm">
      <p class="question">${esc(qText(q))}</p>
      <div id="optBox">${optionsHTML(q)}</div>
    </section>
    <p class="opp" id="oppStat"></p>
  </div>`);
  const lock=choice=>{
    if(RT.myAns) return;
    const t=Math.min(Math.round(performance.now()-RT.start),QTIME);
    RT.myAns={g:g.id,r:g.r,c:choice,t,lk:true};
    document.getElementById('optBox').innerHTML=optionsHTML(q,{mine:choice,locked:true});
    document.getElementById('oppStat').insertAdjacentHTML('beforebegin',`<p class="footnote">${choice?'Eingeloggt nach '+fmtSec(t):'Zeit abgelaufen'}</p>`);
    onLock(RT.myAns);
  };
  view.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>lock(b.dataset.opt));
  if(autoRead) speak(qSpeak(q));
  const fill=document.getElementById('tfill'), left=document.getElementById('tleft');
  RT.tInt=setInterval(()=>{
    const rest=Math.max(0,QTIME-(performance.now()-RT.start));
    fill.style.width=(rest/QTIME*100)+'%'; fill.classList.toggle('low',rest<8000);
    left.textContent=Math.ceil(rest/1000);
    if(rest<=0){ clearInterval(RT.tInt); RT.tInt=null; lock(''); }
  },200);
}
/* Antwort, die zu dieser Runde gehört (oder null) */
function answerFor(a,g){ return a&&a.g===g.id&&a.r===g.r?a:null; }

/* Countdown unter der Auflösung */
function startRevealCountdown(last){
  const t0=performance.now(), el=document.getElementById('nextIn');
  RT.revInt=setInterval(()=>{ const s=Math.max(0,Math.ceil((REVEAL-(performance.now()-t0))/1000)); if(el) el.textContent=(last?'Auswertung in ':'Nächste Runde in ')+s+' s'; },250);
}
function verdictHTML(label,r){
  return `<div class="pv ${r.ok?'ok':'no'}"><div class="pvh"><small>${esc(label)}</small><b>${r.ok?'Richtig':!r.c?'Keine Antwort':'Falsch'}</b><span>+${r.pt}</span></div><small class="tm">${r.c?fmtSec(r.t):'—'}</small></div>`;
}

/* ---------- Duell 1 gegen 1 ----------
   Raum "duel-<4 Ziffern>". Gastgeber-Eintrag: {role:'host', nick, g:Spielstand}, Gast: {role:'guest', nick, a:Antwort}.
   Spielstand g: {id, qs, r (Runde), ph (q/rev/end), op (Gast), sc:[Gastgeber, Gast], res:{h,o}} */
const newDuelCode=()=>String(Math.floor(1000+Math.random()*9000));
const isHost=()=>DUEL.role==='host';
const curGame=()=>isHost()?DUEL.game:DUEL.hg;
const oppName=()=>DUEL.oppNick||'Gegner';

async function hostDuel(code,target){
  DUEL.role='host'; DUEL.target=target?(target.presence.nick||'Spieler'):null;
  DUEL.outInv=target?{to:target.peer,code}:null;
  await enterDuel(code);
}
async function joinDuel(code){
  DUEL.role='guest'; DUEL.target=null; DUEL.outInv=null;
  await enterDuel(code);
}
async function enterDuel(code){
  DUEL.code=code; DUEL.view='wait'; pushLobby(); renderWait();
  let r;
  try{ r=await DUEL.room.join('duel-'+code); }
  catch(e){ leaveDuel('Dem Duell konnte nicht beigetreten werden. Versuch es gleich nochmal.'); return; }
  if(DUEL.view!=='wait'||DUEL.code!==code){ r.leave().catch(()=>{}); return; }
  DUEL.named=r;
  DUEL.unsub.push(r.onPeers(onDuelPeers,()=>{ if(DUEL.named===r) leaveDuel('Die Verbindung zum Duell ist abgebrochen.'); }));
  r.presence({role:DUEL.role,nick:myName()}).catch(()=>{});
  if(!isHost()) DUEL.timers.push(setTimeout(()=>{ if(DUEL.named===r&&!hostPeer()) leaveDuel('Kein offenes Duell mit diesem Code gefunden.'); },9000));
}
const roomPeers=()=>DUEL.named?DUEL.named.peers():[];
const hostPeer=()=>roomPeers().find(p=>!p.isMe&&p.presence.role==='host');
function oppPeer(){ return isHost()?(DUEL.game&&roomPeers().find(p=>p.peer===DUEL.game.op)):hostPeer(); }

function onDuelPeers(){
  if(!DUEL.named) return;
  if(isHost()){
    const g=DUEL.game;
    if(!g){ const guest=roomPeers().find(p=>!p.isMe&&p.presence.role==='guest'); if(guest) startDuel(guest.peer); return; }
    const opp=oppPeer();
    if(!opp){ if(g.ph!=='end') leaveDuel('Dein Gegner hat das Duell verlassen.'); return; }
    DUEL.oppNick=opp.presence.nick||'Gegner';
    hostCheck(); renderOppStatus();
    return;
  }
  const h=hostPeer();
  if(!h){ if(DUEL.hg&&DUEL.hg.ph!=='end') leaveDuel('Dein Gegner hat das Duell verlassen.'); return; }
  DUEL.oppNick=h.presence.nick||'Gegner'; DUEL.oppId=h.by;
  const g=h.presence.g;
  if(!g){ const s=document.getElementById('waitSub'); if(s) s.textContent='Verbunden. Gleich geht es los …'; return; }
  if(g.op!==DUEL.myPeer){ leaveDuel('Dieses Duell läuft schon mit jemand anderem.'); return; }
  guestFollow(g);
}

/* ----- Gastgeber ----- */
function startDuel(op){
  DUEL.outInv=null; DUEL.hist=[]; DUEL.view='game'; pushLobby();
  DUEL.game={id:Math.random().toString(36).slice(2,8),qs:pickQs(),r:0,ph:'q',op,sc:[0,0]};
  const opp=oppPeer(); DUEL.oppNick=(opp&&opp.presence.nick)||'Gegner';
  pushHost(); beginRound();
}
function pushHost(){ if(DUEL.named) DUEL.named.presence({role:'host',nick:myName(),g:DUEL.game}).catch(()=>{}); }
function beginRound(){ showDuelQuestion(DUEL.game); RT.deadline=setTimeout(hostReveal,QTIME+3000); }
function hostCheck(){
  const g=DUEL.game; if(!g||g.ph!=='q') return;
  const opp=oppPeer(), oa=answerFor(opp&&opp.presence.a,g);
  if(RT.myAns&&oa&&oa.lk) hostReveal();
}
function hostReveal(){
  const g=DUEL.game; if(!g||g.ph!=='q') return;
  clearRoundTimers();
  const opp=oppPeer();
  const mine=RT.myAns||{c:'',t:QTIME}, theirs=answerFor(opp&&opp.presence.a,g)||{c:'',t:QTIME};
  const key=correctKey(g.qs[g.r]);
  const h=evalChoice(mine.c,key,mine.t), o=evalChoice(theirs.c,key,theirs.t);
  g.sc=[g.sc[0]+h.pt,g.sc[1]+o.pt]; g.ph='rev'; g.res={h,o};
  pushHost(); showDuelReveal(g);
  RT.next=setTimeout(()=>{
    if(DUEL.game!==g) return;
    delete g.res;
    if(g.r+1>=ROUNDS){ g.ph='end'; pushHost(); showDuelEnd(g); }
    else { g.r++; g.ph='q'; pushHost(); beginRound(); }
  },REVEAL);
}

/* ----- Gast: folgt dem Spielstand des Gastgebers ----- */
function guestFollow(g){
  const prev=DUEL.hg; DUEL.hg=g;
  const key=g.id+':'+g.r+':'+g.ph;
  if(key===DUEL.lastKey){ renderOppStatus(); return; }
  DUEL.lastKey=key;
  if(!prev||prev.id!==g.id) DUEL.hist=[];
  if(g.ph==='q'){ DUEL.view='game'; pushLobby(); showDuelQuestion(g); }
  else if(g.ph==='rev'&&g.res){ clearRoundTimers(); showDuelReveal(g); }
  else if(g.ph==='end'){ clearRoundTimers(); showDuelEnd(g); }
}

/* ----- Ansichten ----- */
function scores(g){ return isHost()?[g.sc[0],g.sc[1]]:[g.sc[1],g.sc[0]]; }
function scoreHTML(g){
  const [a,b]=scores(g);
  return `<div class="score"><div class="sc me"><small>Du</small><b>${a}</b></div><div class="sc mid">Runde ${Math.min(g.r+1,ROUNDS)} von ${ROUNDS}</div><div class="sc op"><small>${esc(oppName())}</small><b>${b}</b></div></div>`;
}
function renderWait(){
  clearRoundTimers(); inviteBar.hidden=true;
  setBack('Abbrechen',()=>leaveDuel());
  const host=isHost();
  showPage(`<div class="stack">
    <section class="card center tall">
      ${host&&!DUEL.target?`<p class="sectionhead">Dein Duell-Code</p><div class="codebig">${esc(DUEL.code)}</div><p class="sub">Schick den Code deinem Freund. Er tippt unter „Online spielen“ auf „Beitreten“ und gibt ihn ein.</p>`:''}
      ${host&&DUEL.target?`<p class="sectionhead">Herausforderung gesendet</p><p>Warte, bis <b>${esc(DUEL.target)}</b> annimmt …</p>`:''}
      ${!host?`<p class="sectionhead">Duell ${esc(DUEL.code)}</p><p id="waitSub">Verbinde …</p>`:''}
      <div class="spinner" aria-hidden="true"></div>
    </section>
    <button class="btn plain" id="cancel">Abbrechen</button>
  </div>`);
  view.querySelector('#cancel').onclick=()=>leaveDuel();
}
function showDuelQuestion(g){
  setBack('Aufgeben',()=>leaveDuel());
  showRoundQuestion(scoreHTML(g),g,a=>{
    if(DUEL.named) DUEL.named.presence({a}).catch(()=>{});
    if(isHost()) hostCheck();
  });
  renderOppStatus();
}
function renderOppStatus(){
  const el=document.getElementById('oppStat'), g=curGame(); if(!el||!g||g.ph!=='q') return;
  const o=oppPeer(), a=answerFor(o&&o.presence.a,g);
  el.innerHTML=a&&a.lk?`<i class="done"></i>${esc(oppName())} hat eingeloggt`:`<i></i>${esc(oppName())} denkt nach …`;
}
function showDuelReveal(g){
  const q=g.qs[g.r];
  const mine=isHost()?g.res.h:g.res.o, theirs=isHost()?g.res.o:g.res.h;
  if(!DUEL.hist.some(h=>h.r===g.r)) DUEL.hist.push({r:g.r,mid:q.m,k:q.k,me:mine,op:theirs});
  const last=g.r+1>=ROUNDS;
  showPage(`<div class="stack">${scoreHTML(g)}
    <div class="duo">${verdictHTML('Du',mine)}${verdictHTML(oppName(),theirs)}</div>
    ${qCardHTML(q,true)}
    ${optionsHTML(q,{reveal:true,mine:mine.c,theirs:theirs.c,theirName:oppName(),locked:true})}
    <p class="footnote" id="nextIn">${last?'Gleich kommt die Auswertung …':'Nächste Runde gleich …'}</p>
  </div>`);
  startRevealCountdown(last);
  if(autoRead) speak((mine.ok?'Richtig':'Falsch')+'. '+oppName()+(theirs.ok?' richtig':' falsch')+'.');
}
function showDuelEnd(g){
  clearRoundTimers(); DUEL.view='game';
  setBack('Zurück',()=>leaveDuel());
  const [a,b]=scores(g);
  const head=a>b?'Gewonnen!':a<b?'Verloren':'Unentschieden';
  const rows=DUEL.hist.slice().sort((x,y)=>x.r-y.r).map(h=>`<div class="row"><span class="label"><span>${esc(M[h.mid].n)}</span><small>${esc(FIELD[h.k])}</small></span><span class="badges"><span class="badge ${h.me.ok?'good':'bad'}">Du +${h.me.pt}</span><span class="badge ${h.op.ok?'good':'bad'}">${esc(oppName())} +${h.op.pt}</span></span></div>`).join('');
  showPage(`<div class="stack">
    <div class="pagehead"><h2 class="pagetitle big${a>b?' win':''}">${head}</h2><p class="sub score-line">Du ${a} : ${b} ${esc(oppName())}</p></div>
    <p class="footnote" id="h2hLine"></p>
    <section class="group list">${rows}</section>
    <div class="stack-sm">${isHost()?'<button class="btn primary" id="again">Revanche</button>':'<p class="footnote">Revanche? Dein Gegner kann eine neue Runde starten. Bleib einfach hier.</p>'}<button class="btn plain" id="leave">Duell verlassen</button></div>
  </div>`);
  const ag=view.querySelector('#again');
  if(ag) ag.onclick=()=>{ const opp=oppPeer(); if(opp) startDuel(opp.peer); else leaveDuel('Dein Gegner ist nicht mehr da.'); };
  view.querySelector('#leave').onclick=()=>leaveDuel();
  if(autoRead) speak(head+'. '+a+' zu '+b+'.');
  if(DUEL.reported!==g.id){
    DUEL.reported=g.id;
    saveGameResult({gid:g.id,opp:isHost()?g.op:DUEL.oppId,me:a,them:b,host:isHost()});
  }
}

function leaveDuelRoom(){
  clearRoundTimers();
  DUEL.timers.forEach(clearTimeout); DUEL.timers=[];
  DUEL.unsub.forEach(u=>{ try{ u(); }catch(e){} }); DUEL.unsub=[];
  const r=DUEL.named; DUEL.named=null; if(r) r.leave().catch(()=>{});
  Object.assign(DUEL,{game:null,hg:null,lastKey:null,outInv:null,role:null,code:null,target:null});
}
function leaveDuel(msg){ leaveDuelRoom(); stopSpeaking(); renderLobby(msg); }

/* ---------- Gruppen-Lobby: bis zu 8 Spieler gleichzeitig ----------
   Raum "grp-<5 Ziffern>". Gastgeber-Eintrag: {role:'host', nick, g:Spielstand|null}, Mitspieler: {role:'m', nick, a:Antwort}.
   Spielstand g: {id, qs, r, ph (q/rev/end), pl:[Spieler], nm:{Spieler:Name}, sc:{Spieler:Punkte}, res:{Spieler:Ergebnis}}
   Wer während eines Spiels beitritt, wartet bis zur nächsten Runde. */
const GMAX=8;
const GRP={named:null,code:null,host:false,game:null,hg:null,lastKey:null,unsub:[],timers:[],hist:[],invited:new Set()};

const newGroupCode=()=>String(Math.floor(10000+Math.random()*90000));
const gPeers=()=>GRP.named?GRP.named.peers().filter(p=>p.presence.nick):[];
const gHostPeer=()=>gPeers().find(p=>p.presence.role==='host');
const gCur=()=>GRP.host?GRP.game:GRP.hg;
const gMe=()=>DUEL.myPeer;

async function openGroup(code){
  if(!(await ensureAuth('duel'))) return;
  if(!(await initLobby())){ renderLobby('Keine Verbindung. Versuch es gleich nochmal.'); return; }
  GRP.host=!code;
  await enterGroup(code||newGroupCode());
}
async function enterGroup(code){
  leaveOnline();
  GRP.code=code; GRP.invited=new Set(); S.phase='duel'; DUEL.view='group'; pushLobby(); inviteBar.hidden=true;
  setBack('Abbrechen',()=>leaveGroup());
  showPage(`<div class="stack"><section class="card center tall"><p class="sectionhead">Lobby ${esc(code)}</p><p>Verbinde …</p><div class="spinner" aria-hidden="true"></div></section></div>`);
  let r;
  try{ r=await DUEL.room.join('grp-'+code); }
  catch(e){ leaveGroup('Der Lobby konnte nicht beigetreten werden. Versuch es gleich nochmal.'); return; }
  if(GRP.code!==code){ r.leave().catch(()=>{}); return; }
  GRP.named=r;
  GRP.unsub.push(r.onPeers(onGroupPeers,()=>{ if(GRP.named===r) leaveGroup('Die Verbindung zur Lobby ist abgebrochen.'); }));
  await r.presence({role:GRP.host?'host':'m',nick:myName()}).catch(()=>{});
  if(GRP.host){ pushGroupHost(); renderGroupLobby(); }
  else GRP.timers.push(setTimeout(()=>{ if(GRP.named===r&&!gHostPeer()) leaveGroup('Keine offene Lobby mit diesem Code gefunden.'); },9000));
}

function onGroupPeers(){
  if(!GRP.named) return;
  if(GRP.host){
    const g=GRP.game;
    if(!g||g.ph==='end') renderGroupMembers();
    else { gHostCheck(); gRenderStatus(); }
    return;
  }
  if(!gHostPeer()){ if(gPeers().some(p=>p.isMe)) leaveGroup('Der Gastgeber hat die Lobby verlassen.'); return; }
  if(!GRP.lastKey&&gPeers().length>GMAX){ leaveGroup('Diese Lobby ist voll.'); return; }
  gFollow(gHostPeer().presence.g||null);
}
/* Mitspieler folgen dem Spielstand des Gastgebers */
function gFollow(g){
  const prev=GRP.hg; GRP.hg=g;
  if(!g){
    if(GRP.lastKey!=='lobby'){ GRP.lastKey='lobby'; renderGroupLobby(); } else renderGroupMembers();
    return;
  }
  const inGame=(g.pl||[]).includes(gMe());
  const key=g.id+':'+g.r+':'+g.ph+':'+inGame;
  if(key===GRP.lastKey){ gRenderStatus(); return; }
  GRP.lastKey=key;
  if(!prev||prev.id!==g.id) GRP.hist=[];
  if(!inGame) renderGroupSpectator(g);
  else if(g.ph==='q') gShowQuestion(g);
  else if(g.ph==='rev'&&g.res){ clearRoundTimers(); gShowReveal(g); }
  else if(g.ph==='end'){ clearRoundTimers(); gShowEnd(g); }
}

/* ----- Warteraum ----- */
function renderGroupLobby(msg){
  clearRoundTimers(); S.phase='duel'; DUEL.view='group'; pushLobby(); inviteBar.hidden=true;
  setBack('Verlassen',()=>leaveGroup());
  const hp=gHostPeer();
  showPage(`<div class="stack">
    <div class="pagehead"><h2 class="pagetitle">Lobby</h2><p class="sub">Bis zu ${GMAX} Spieler · alle bekommen dieselbe Frage · ${ROUNDS} Runden à 30 Sekunden · je schneller richtig, desto mehr Punkte</p></div>
    <section class="card center">
      <p class="sectionhead">Lobby-Code</p><div class="codebig">${esc(GRP.code)}</div>
      <p class="sub">${GRP.host?'Schick den Code an deine Freunde. Sie geben ihn unter „Online spielen“ → „Mit Code beitreten“ ein. Oder lade sie unten direkt ein.':`Warte, bis ${esc((hp&&hp.presence.nick)||'der Gastgeber')} das Spiel startet …`}</p>
    </section>
    <p class="group-label" id="gCount">Spieler</p>
    <section class="group list" id="gMembers"></section>
    ${GRP.host?`<button class="btn primary" id="gStart">Spiel starten</button>
    <p class="group-label">Einladen</p>
    <section class="group list" id="gInvite"></section>`:''}
    <button class="btn plain" id="gLeave">Lobby verlassen</button>
    <p class="hint" id="gHint" role="status"></p>
  </div>`);
  if(msg) setHint('gHint',msg);
  const st=document.getElementById('gStart'); if(st) st.onclick=gStartGame;
  document.getElementById('gLeave').onclick=()=>leaveGroup();
  renderGroupMembers();
}
function renderGroupMembers(){
  const box=document.getElementById('gMembers'); if(!box) return;
  const ps=gPeers().slice().sort((a,b)=>(b.presence.role==='host')-(a.presence.role==='host'));
  box.innerHTML=ps.map(p=>`<div class="row">${avatarFor(p.by,p.presence.nick,false)}<span class="label"><span>${esc(p.presence.nick)}${p.isMe?' (du)':''}</span><small>${p.presence.role==='host'?'Gastgeber':'bereit'}</small></span></div>`).join('')||infoRow('Verbinde …');
  document.getElementById('gCount').textContent=`Spieler (${ps.length} von ${GMAX})`;
  const st=document.getElementById('gStart');
  if(st){ st.disabled=ps.length<2; st.textContent=ps.length<2?'Warte auf Mitspieler …':`Spiel starten (${ps.length} Spieler)`; }
  renderGroupInvite();
}
function renderGroupInvite(){
  const box=document.getElementById('gInvite'); if(!box) return;
  const inRoom=new Set(gPeers().map(p=>p.by));
  const list=lobbyPeers().filter(p=>!inRoom.has(p.by)).sort((a,b)=>isFriend(b.by)-isFriend(a.by));
  if(!list.length){ box.innerHTML=infoRow('Gerade ist niemand sonst online.','Schick den Code einfach per Nachricht.'); return; }
  box.innerHTML=list.map(p=>{ const inv=GRP.invited.has(p.peer);
    return `<div class="row">${avatarFor(p.by,p.presence.nick,p.presence.busy)}<span class="label"><span>${esc(p.presence.nick||'Spieler')}</span><small>${p.presence.busy?'spielt gerade':isFriend(p.by)?'Freund · online':'online'}</small></span><button class="btn tinted small" data-ginv="${esc(p.peer)}" ${inv||p.presence.busy?'disabled':''}>${inv?'Eingeladen':'Einladen'}</button></div>`; }).join('');
  box.querySelectorAll('[data-ginv]').forEach(b=>b.onclick=()=>{ GRP.invited.add(b.dataset.ginv); pushLobby(); renderGroupInvite(); });
}
function groupInvitePresence(){ return GRP.host&&GRP.code&&GRP.invited.size?{to:[...GRP.invited],code:GRP.code}:null; }

/* ----- Gastgeber steuert das Spiel ----- */
function pushGroupHost(){ if(GRP.named) GRP.named.presence({role:'host',nick:myName(),g:GRP.game}).catch(()=>{}); }
function gStartGame(){
  const ps=gPeers().slice(0,GMAX); if(ps.length<2) return;
  const nm={}, sc={};
  ps.forEach(p=>{ nm[p.peer]=String(p.presence.nick).slice(0,24); sc[p.peer]=0; });
  GRP.game={id:Math.random().toString(36).slice(2,8),qs:pickQs(),r:0,ph:'q',pl:ps.map(p=>p.peer),nm,sc};
  GRP.invited=new Set(); GRP.hist=[]; pushLobby();
  pushGroupHost(); gBeginRound();
}
function gBeginRound(){ gShowQuestion(GRP.game); RT.deadline=setTimeout(gHostReveal,QTIME+3000); }
function gActive(g){ const here=new Set(gPeers().map(p=>p.peer)); return (g.pl||[]).filter(p=>here.has(p)); }
function gAnswerOf(peer,g){
  if(peer===gMe()) return RT.myAns;
  const p=gPeers().find(x=>x.peer===peer);
  return answerFor(p&&p.presence.a,g);
}
function gHostCheck(){
  const g=GRP.game; if(!g||g.ph!=='q') return;
  if(gActive(g).every(p=>{ const a=gAnswerOf(p,g); return a&&a.lk; })) gHostReveal();
}
function gHostReveal(){
  const g=GRP.game; if(!g||g.ph!=='q') return;
  clearRoundTimers();
  const key=correctKey(g.qs[g.r]), here=new Set(gPeers().map(p=>p.peer));
  g.sc=g.sc||{}; g.res={};
  g.pl.forEach(p=>{
    const a=gAnswerOf(p,g)||{c:'',t:QTIME};
    const e=evalChoice(a.c,key,a.t); e.gone=!here.has(p);
    g.res[p]=e; g.sc[p]=(g.sc[p]||0)+e.pt;
  });
  g.ph='rev'; pushGroupHost(); gShowReveal(g);
  RT.next=setTimeout(()=>{
    if(GRP.game!==g) return;
    delete g.res;
    if(g.r+1>=ROUNDS){ g.ph='end'; pushGroupHost(); gShowEnd(g); }
    else { g.r++; g.ph='q'; pushGroupHost(); gBeginRound(); }
  },REVEAL);
}
function gBackToLobby(){ GRP.game=null; GRP.hist=[]; pushGroupHost(); renderGroupLobby(); }

/* ----- Ansichten ----- */
function gRanking(g){
  const sc=g.sc||{}, nm=g.nm||{};
  const rows=(g.pl||[]).map(p=>({p,n:nm[p]||'Spieler',s:sc[p]||0})).sort((a,b)=>b.s-a.s||a.n.localeCompare(b.n));
  rows.forEach((r,i)=>{ r.rank=i&&rows[i-1].s===r.s?rows[i-1].rank:i+1; });   // gleiche Punkte = gleicher Platz
  return rows;
}
function gTopHTML(g){
  const rk=gRanking(g), mine=rk.find(r=>r.p===gMe())||{s:0,rank:'–'};
  return `<div class="score"><div class="sc me"><small>Du</small><b>${mine.s}</b></div><div class="sc mid">Runde ${Math.min(g.r+1,ROUNDS)} von ${ROUNDS}</div><div class="sc op"><small>Platz</small><b>${mine.rank}<span class="of">/${rk.length}</span></b></div></div>`;
}
function gShowQuestion(g){
  S.phase='duel'; DUEL.view='group';
  setBack('Verlassen',()=>leaveGroup());
  showRoundQuestion(gTopHTML(g),g,a=>{
    if(GRP.named) GRP.named.presence({a}).catch(()=>{});
    gRenderStatus();
    if(GRP.host) gHostCheck();
  });
  gRenderStatus();
}
function gRenderStatus(){
  const el=document.getElementById('oppStat'), g=gCur(); if(!el||!g||g.ph!=='q') return;
  const others=gActive(g).filter(p=>p!==gMe());
  const done=others.filter(p=>{ const a=gAnswerOf(p,g); return a&&a.lk; }).length;
  el.innerHTML=`<i class="${done===others.length?'done':''}"></i>${done} von ${others.length} ${others.length===1?'Mitspieler hat':'Mitspielern haben'} eingeloggt`;
}
function gResultRow(r,res){
  const e=res[r.p]||{c:'',ok:false,pt:0,t:QTIME}, me=r.p===gMe();
  const detail=e.gone?'hat verlassen':!e.c?'keine Antwort':(e.ok?'richtig':'falsch')+' · '+fmtSec(e.t);
  return `<div class="row${me?' me-row':''}"><span class="rank">${r.rank}</span><span class="label"><span>${esc(r.n)}${me?' (du)':''}</span><small>${detail}</small></span><span class="badge ${e.ok?'good':'bad'}">+${e.pt}</span><span class="value"><b>${r.s}</b></span></div>`;
}
function gShowReveal(g){
  const q=g.qs[g.r], res=g.res||{};
  const mine=res[gMe()]||{c:'',ok:false,pt:0,t:QTIME};
  if(!GRP.hist.some(h=>h.r===g.r)) GRP.hist.push({r:g.r,mid:q.m,k:q.k,me:mine});
  const last=g.r+1>=ROUNDS, right=Object.values(res).filter(e=>e.ok).length;
  showPage(`<div class="stack">${gTopHTML(g)}
    ${verdictHTML('Du',mine)}
    <p class="footnote">${right} von ${Object.keys(res).length} richtig</p>
    ${qCardHTML(q,true)}
    ${optionsHTML(q,{reveal:true,mine:mine.c,locked:true})}
    <p class="group-label">Zwischenstand</p>
    <section class="group list">${gRanking(g).map(r=>gResultRow(r,res)).join('')}</section>
    <p class="footnote" id="nextIn">${last?'Gleich kommt die Auswertung …':'Nächste Runde gleich …'}</p>
  </div>`);
  startRevealCountdown(last);
  if(autoRead) speak(mine.ok?'Richtig.':'Falsch.');
}
function gShowEnd(g){
  clearRoundTimers();
  setBack('Lobby',()=>GRP.host?gBackToLobby():leaveGroup());
  const rk=gRanking(g), mine=rk.find(r=>r.p===gMe())||{rank:rk.length,s:0};
  const head=mine.rank===1?(rk.filter(r=>r.rank===1).length>1?'Geteilter 1. Platz!':'Gewonnen!'):`Platz ${mine.rank} von ${rk.length}`;
  const medal=['🥇','🥈','🥉'];
  const rows=rk.map(r=>`<div class="row${r.p===gMe()?' me-row':''}"><span class="rank">${medal[r.rank-1]||r.rank}</span><span class="label"><span>${esc(r.n)}${r.p===gMe()?' (du)':''}</span></span><span class="value"><b>${r.s}</b> Pkt.</span></div>`).join('');
  const hist=GRP.hist.slice().sort((x,y)=>x.r-y.r).map(h=>`<div class="row"><span class="label"><span>${esc(M[h.mid].n)}</span><small>${esc(FIELD[h.k])}</small></span><span class="badge ${h.me.ok?'good':'bad'}">+${h.me.pt}</span></div>`).join('');
  showPage(`<div class="stack">
    <div class="pagehead"><h2 class="pagetitle big${mine.rank===1?' win':''}">${head}</h2><p class="sub score-line">${mine.s} Punkte</p></div>
    <p class="group-label">Endstand</p>
    <section class="group list">${rows}</section>
    <p class="group-label">Deine Runden</p>
    <section class="group list">${hist}</section>
    <div class="stack-sm">${GRP.host?'<button class="btn primary" id="gAgain">Nochmal spielen</button><button class="btn tinted" id="gLobby">Zurück zur Lobby</button>':'<p class="footnote">Bleib hier – der Gastgeber kann gleich eine neue Runde starten.</p>'}<button class="btn plain" id="gLeave">Lobby verlassen</button></div>
  </div>`);
  const ag=view.querySelector('#gAgain'); if(ag) ag.onclick=()=>gPeers().length<2?gBackToLobby():gStartGame();
  const lb=view.querySelector('#gLobby'); if(lb) lb.onclick=gBackToLobby;
  view.querySelector('#gLeave').onclick=()=>leaveGroup();
  if(autoRead) speak(head+'. '+mine.s+' Punkte.');
}
function renderGroupSpectator(g){
  clearRoundTimers(); DUEL.view='group';
  setBack('Verlassen',()=>leaveGroup());
  showPage(`<div class="stack"><section class="card center tall">
    <p class="sectionhead">Lobby ${esc(GRP.code)}</p>
    <p>${g.ph==='end'?'Das Spiel ist gerade zu Ende.':`Hier läuft gerade ein Spiel (Runde ${Math.min(g.r+1,ROUNDS)} von ${ROUNDS}).`} Bei der nächsten Runde bist du dabei.</p>
    <div class="spinner" aria-hidden="true"></div></section>
    <button class="btn plain" id="gLeave">Lobby verlassen</button></div>`);
  view.querySelector('#gLeave').onclick=()=>leaveGroup();
}

function leaveGroupRoom(){
  clearRoundTimers();
  GRP.timers.forEach(clearTimeout); GRP.timers=[];
  GRP.unsub.forEach(u=>{ try{ u(); }catch(e){} }); GRP.unsub=[];
  const r=GRP.named; GRP.named=null; if(r) r.leave().catch(()=>{});
  Object.assign(GRP,{game:null,hg:null,lastKey:null,code:null,hist:[],invited:new Set()});
}
function leaveGroup(msg){ leaveGroupRoom(); GRP.host=false; stopSpeaking(); renderLobby(msg); }

/* ---------- Seiten: Freundesliste, Freund, Rangliste, eigenes Profil ---------- */
function renderFriendList(){
  const box=document.getElementById('friendList'); if(!box) return;
  const ids=Object.keys(SOC.friends);
  if(!ids.length){ box.innerHTML=infoRow('Noch keine Freunde','Füge Freunde per Name oder Freundescode hinzu.'); return; }
  const online=new Map(lobbyPeers().map(p=>[p.by,p]));
  const nameOf=id=>(SOC.info[id]||{}).name||'';
  ids.sort((a,b)=>(online.has(b)-online.has(a))||nameOf(a).localeCompare(nameOf(b)));
  box.innerHTML=ids.map(fid=>{
    const p=online.get(fid), rc=record(fid), nm=(p&&p.presence.nick)||nameOf(fid)||'Spieler';
    const status=p?(p.presence.busy?'busy':'on'):'off';
    return `<div class="row">${avatarHTML(fid,nm,status)}<button class="label rowlink" data-fr="${esc(fid)}"><span>${esc(nm)}</span><small>${p?(p.presence.busy?'spielt gerade':'online'):'offline'}${rc.games?` · Bilanz ${rc.w} : ${rc.l}`:''}</small></button>${p&&!p.presence.busy?`<button class="btn tinted small" data-ch="${esc(p.peer)}">Herausfordern</button>`:''}</div>`;
  }).join('');
  box.querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>renderFriend(b.dataset.fr));
  box.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>challenge(b.dataset.ch));
}

function fmtDate(ts){ if(!ts) return '—'; try{ return new Date(ts).toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return '—'; } }
const avg=(sum,n)=>n?(sum/n).toFixed(1).replace('.',','):'—';
const valueRow=(label,value)=>`<div class="row"><span class="label">${label}</span><span class="value">${value}</span></div>`;
function renderFriend(fid){
  DUEL.view='friend'; S.phase='duel'; setBack('Zurück',()=>renderLobby());
  const info=SOC.info[fid]||{}, rc=record(fid), p=lobbyPeers().find(x=>x.by===fid);
  const nm=(p&&p.presence.nick)||info.name||'Spieler';
  const st=Object.assign(emptyStats(),info.stats||{});
  showPage(`<div class="stack">
    <div class="pagehead">${avatarHTML(fid,nm,null,'xl')}<h2 class="pagetitle">${esc(nm)}</h2><p class="sub">${p?(p.presence.busy?'spielt gerade':'online'):'offline'}</p></div>
    <div class="score"><div class="sc me"><small>Du</small><b>${rc.w}</b></div><div class="sc mid">Siege<br>${rc.games} ${rc.games===1?'Duell':'Duelle'}</div><div class="sc op"><small>${esc(nm)}</small><b>${rc.l}</b></div></div>
    <p class="group-label">Eure Bilanz</p>
    <section class="group list">
      ${valueRow('Duelle gegeneinander',rc.games)}${valueRow('Deine Siege',rc.w)}${valueRow('Siege von '+esc(nm),rc.l)}${valueRow('Unentschieden',rc.d)}
      ${valueRow('Ø Punkte pro Duell',avg(rc.pm,rc.games)+' : '+avg(rc.pf,rc.games))}${valueRow('Letztes Duell',fmtDate(rc.last))}
    </section>
    <p class="group-label">Gesamt von ${esc(nm)}</p>
    <section class="group list">${valueRow('Ranglistenpunkte',scoreOf(st))}${valueRow('Duelle · Siege',st.games+' · '+st.wins)}</section>
    ${p&&!p.presence.busy?'<button class="btn primary" id="frCh">Herausfordern</button>':''}
    <button class="btn plain muted" id="frRm">Freund entfernen</button>
  </div>`);
  const ch=document.getElementById('frCh'); if(ch) ch.onclick=()=>challenge(p.peer);
  const rm=document.getElementById('frRm');
  rm.onclick=async()=>{
    if(rm.dataset.sure!=='1'){ rm.dataset.sure='1'; rm.textContent='Wirklich entfernen? Nochmal tippen'; rm.classList.remove('muted'); return; }
    rm.disabled=true; await removeFriend(fid); renderLobby('Freund entfernt.');
  };
}

async function renderLeaderboard(mode){
  DUEL.view='board'; S.phase='duel'; setBack('Zurück',()=>renderLobby());
  showPage(`<div class="stack">
    <h2 class="pagetitle">Rangliste</h2>
    <div class="seg" role="group" aria-label="Rangliste"><button data-lb="all" aria-pressed="${mode==='all'}">Alle</button><button data-lb="friends" aria-pressed="${mode==='friends'}">Freunde</button></div>
    <section class="group list" id="lbList">${infoRow('Lade …')}</section>
    <p class="footnote">Duelle 1 gegen 1 · Sieg 3 Punkte · Unentschieden 1 Punkt</p>
  </div>`);
  view.querySelectorAll('[data-lb]').forEach(b=>b.onclick=()=>renderLeaderboard(b.dataset.lb));
  const me=FB.user.uid; let rows=[];
  try{
    if(mode==='all'){
      const v=(await FB.db.ref('users').orderByChild('score').limitToLast(100).once('value')).val()||{};
      rows=Object.keys(v).map(id=>Object.assign({id},v[id]));
    } else {
      rows=await Promise.all([me,...Object.keys(SOC.friends)].map(async id=>Object.assign({id},(await userRef(id).once('value').catch(()=>null))?.val()||{})));
    }
  }catch(e){ const l=document.getElementById('lbList'); if(l) l.innerHTML=infoRow('Die Rangliste konnte nicht geladen werden.'); return; }
  const l=document.getElementById('lbList'); if(!l||DUEL.view!=='board') return;
  rows=rows.filter(r=>r.id===me||(r.stats&&r.stats.games>0))
    .sort((a,b)=>(b.score||0)-(a.score||0)||((b.stats||{}).wins||0)-((a.stats||{}).wins||0));
  if(!rows.length){ l.innerHTML=infoRow('Noch keine Duelle gespielt.'); return; }
  l.innerHTML=rows.map((r,i)=>{ const st=Object.assign(emptyStats(),r.stats||{});
    return `<div class="row${r.id===me?' me-row':''}"><span class="rank">${i+1}</span>${avatarHTML(r.id,r.name||'Spieler',null,'',r.photo||null)}<span class="label"><span>${esc(r.name||'Spieler')}${r.id===me?' (du)':''}</span><small>${st.games} Duelle · ${st.wins} Siege</small></span><span class="value"><b>${r.score||0}</b></span></div>`; }).join('');
}

/* ----- Eigenes Profil: Bild, Name, Freundescode, Freunde finden, wer ist online ----- */
async function openProfile(){
  if(!(await ensureAuth('profile'))) return;
  await initLobby();
  renderProfile();
}
function renderProfile(msg){
  if(!SOC.profile){ openProfile(); return; }
  leaveOnline(); S.phase='duel'; DUEL.view='profile'; setBack('Start',renderStart);
  const p=SOC.profile, st=Object.assign(emptyStats(),p.stats||{});
  showPage(`<div class="stack">
    <section class="pagehead">
      ${avatarHTML(FB.user.uid,p.name,null,'xl',p.photo||null)}
      <div class="btnrow center-row">
        <label class="btn tinted small" for="photoIn">${p.photo?'Foto ändern':'Profilbild hinzufügen'}</label>
        ${p.photo?'<button class="btn plain small" id="photoRm">Entfernen</button>':''}
      </div>
      <input type="file" id="photoIn" accept="image/*" hidden>
      <p class="hint" id="photoHint" role="status"></p>
    </section>
    <section class="stack-sm"><label class="group-label" for="pName">Dein Name</label><input id="pName" class="field" maxlength="24" value="${esc(p.name)}" autocomplete="nickname"></section>
    <section class="group list">
      <div class="row"><span class="label"><span>Dein Freundescode</span><b class="fcode">${esc(p.code||'…')}</b><small>Freunde können dich damit finden</small></span><button class="btn tinted small" id="copyCode">Kopieren</button></div>
      ${valueRow('Ranglistenpunkte','<b>'+scoreOf(st)+'</b>')}${valueRow('Duelle · Siege',st.games+' · '+st.wins)}
    </section>

    <p class="group-label">Freunde finden</p>
    <section class="card">
      <input id="fSearch" class="field" type="search" placeholder="Name oder Freundescode" aria-label="Freunde suchen" autocomplete="off">
      <div class="list" id="fResults"></div>
    </section>

    <p class="group-label">Deine Freunde</p>
    <section class="group list" id="friendList"></section>

    <p class="group-label">Gerade online</p>
    <section class="group list" id="othersOnline"></section>

    <section class="group"><button class="row" id="lbRow"><span class="label">Rangliste</span>${IC.chev}</button></section>
    ${accountRowHTML()}
    <p class="hint" id="profileHint" role="status"></p>
  </div>`);
  if(msg) setHint('profileHint',msg);
  bindAccount();

  const pi=document.getElementById('photoIn');
  pi.onchange=async()=>{
    const f=pi.files&&pi.files[0]; if(!f) return;
    setHint('photoHint','Wird gespeichert …');
    try{ await savePhoto(await resizePhoto(f)); renderProfile('Profilbild gespeichert.'); }
    catch(e){ setHint('photoHint','Dieses Bild konnte nicht gelesen werden. Versuch ein JPG oder PNG.',true); }
  };
  const rm=document.getElementById('photoRm'); if(rm) rm.onclick=async()=>{ await savePhoto(null); renderProfile('Profilbild entfernt.'); };

  const pn=document.getElementById('pName'); let nameTimer=null;
  pn.oninput=()=>{ clearTimeout(nameTimer); nameTimer=setTimeout(()=>saveName(pn.value),600); };
  document.getElementById('copyCode').onclick=async()=>{
    try{ await navigator.clipboard.writeText(p.code); setHint('profileHint','Freundescode kopiert.'); }catch(e){ setHint('profileHint','Dein Code: '+p.code); }
  };

  const fs=document.getElementById('fSearch'), fr=document.getElementById('fResults'); let searchTimer=null, seq=0;
  fs.oninput=()=>{
    clearTimeout(searchTimer);
    if(fs.value.trim().length<2){ fr.innerHTML=''; return; }
    searchTimer=setTimeout(async()=>{
      const my=++seq; fr.innerHTML=infoRow('','Suche …');
      const res=await searchUsers(fs.value); if(my!==seq) return;
      if(!res.length){ fr.innerHTML=infoRow('','Niemand gefunden. Prüf die Schreibweise oder frag nach dem Freundescode.'); return; }
      fr.innerHTML=res.map(({id,u})=>`<div class="row">${avatarHTML(id,u.name,null,'',u.photo||null)}<span class="label"><span>${esc(u.name||'Spieler')}</span><small>${(u.stats&&u.stats.games)||0} Duelle</small></span>${isFriend(id)?'<span class="value">Freund</span>':`<button class="btn tinted small" data-addr="${esc(id)}">Hinzufügen</button>`}</div>`).join('');
      fr.querySelectorAll('[data-addr]').forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await addFriend(b.dataset.addr); b.outerHTML='<span class="value">Freund</span>'; }catch(e){ b.disabled=false; } });
    },350);
  };
  document.getElementById('lbRow').onclick=()=>renderLeaderboard('all');
  renderFriendList(); renderOnlineList('othersOnline');
}

/* ---------- Start ---------- */
applyTheme();
if(window.matchMedia) try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme); }catch(e){}
bindHeader();
renderStart();

/* Offline-Lernen und „Zum Startbildschirm hinzufügen“ */
if('serviceWorker' in navigator&&location.protocol==='https:') window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* Wer schon angemeldet war, ist beim Öffnen direkt online (für Einladungen und die Freundesliste) */
if(lsGet('ad-auth')==='1'&&fbConfigured()&&navigator.onLine){
  setTimeout(async()=>{ try{ await loadFirebase(); if(FB.user){ await ensureProfile(); await initLobby(); } }catch(e){} },300);
}
</script>
