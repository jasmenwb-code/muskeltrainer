<script>
/* ---------- Daten aus dem Skript ---------- */
const REG = {
  rumpf:'Hals, Thorax & Bauch', ruecken:'Rücken', schulter:'Schultergürtel & Schulter', oberarm:'Oberarm',
  unterarm:'Unterarm & Hand', huefte:'Hüfte & Gesäß', oberschenkel:'Oberschenkel', unterschenkel:'Unterschenkel & Fuß'
};
const FIELD = {
  U:{label:'Ursprung', short:'Ursprung', q:'Wo entspringt der Muskel? Nenne alle Ursprünge, mit allen Anteilen.'},
  A:{label:'Ansatz', short:'Ansatz', q:'Wo setzt der Muskel an? Nenne alle Ansätze.'},
  UA:{label:'Ursprung & Ansatz', short:'Urspr./Ans.', q:'Zwischen welchen Strukturen verläuft der Muskel? Nenne Ursprung und Ansatz aller Anteile.'},
  F:{label:'Funktion', short:'Funktion', q:'Welche Funktionen hat der Muskel?'},
  I:{label:'Innervation', short:'Innervation', q:'Welche Nerven innervieren den Muskel, mit Segmenten?'}
};
const ORDER = ['U','A','UA','F','I'];
const OSG_PF = 'oberes Sprunggelenk :: Plantarflexion', USG_INV = 'unteres Sprunggelenk :: Inversion (Supination)', USG_EV = 'unteres Sprunggelenk :: Eversion (Pronation)', OSG_DE = 'oberes Sprunggelenk :: Dorsalextension';
const RAD68 = ['N. radialis (C6–8)'], SUP_HINT = '! hilft bei der Supination';
const ADD_STAB = 'Stabilisierung des Beckens in der Frontal- und Sagittalebene';

const M = [
 // Hals, Thorax & Bauch
 {n:'Mm. scaleni', r:'rumpf',
  U:['M. scalenus anterior :: Tubercula anteriora der Querfortsätze des 3.–6. Halswirbels','M. scalenus medius :: Tubercula posteriora der Querfortsätze des 3.–7. Halswirbels','M. scalenus posterior :: Tubercula posteriora der Querfortsätze des 5.–7. Halswirbels'],
  A:['M. scalenus anterior :: Tuberculum musculi scaleni anterioris der 1. Rippe','M. scalenus medius :: 1. Rippe (dorsal des Sulcus arteriae subclaviae)','M. scalenus posterior :: Außenfläche der 2. Rippe'],
  F:['Punctum mobile an den Rippen :: Inspiration (Heben der oberen Rippen)','Punctum fixum an den Rippen :: Lateralflexion der HWS zur ipsilateralen Seite (bei einseitiger Kontraktion)','Ventralflexion des Halses (bei beidseitiger Kontraktion)'],
  I:['direkte Äste aus dem Plexus cervicalis und dem Plexus brachialis (C3–6)']},

function lowerDe(s){return s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').normalize('NFD').replace(/[̀-ͯ]/g,'')}
function mapTok(t){
  if(NUMW[t]) return NUMW[t];

  if(ROM[t]) return ROM[t];

function toks(str){
  const raw=lowerDe(str).split(/[^a-z0-9]+/).filter(Boolean).map(mapTok);
  const out=[];
  for(let i=0;i<raw.length;i++){
    const t=raw[i];
    if(['c','th','t','l','s'].includes(t) && /^\d+$/.test(raw[i+1]||'')){ out.push((t==='t'?'th':t)+raw[i+1]); i++; }

  const note=s.startsWith('!'); const body=note?s.slice(1).trim():s;
  const k=body.indexOf(' :: ');
  return {note, label:k>=0?body.slice(0,k):'', text:k>=0?body.slice(k+4):body};

function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function close(k,a){
  if(k===a) return true;
  if(/\d/.test(k)||/\d/.test(a)) return false;
  const m=Math.min(k.length,a.length); let p=0; while(p<m && k[p]===a[p]) p++;
  if(p===m && m>=3 && Math.abs(k.length-a.length)<=(m>=5?3:1)) return true;
  if(m>=5 && p>=Math.max(5,m-2)) return true;

   .replace(/\bn\. radialis/g,'nervi radialis').replace(/\bu\./g,'und').replace(/HWS/g,'Halswirbelsäule').replace(/BWS/g,'Brustwirbelsäule').replace(/LWS/g,'Lendenwirbelsäule')
   .replace(/\bTh(\d)/g,'T $1').replace(/\b([CLS])(\d)/g,'$1 $2').replace(/–/g,' bis ').replace(/ :: /g,': ').replace(/[„“]/g,'');
}
function speak(text){
  if(!synth) return; try{ synth.cancel(); const u=new SpeechSynthesisUtterance(ttsText(text)); u.lang='de-DE'; if(deVoice) u.voice=deVoice; u.rate=0.95; synth.speak(u);}catch(e){}
}

/* ---------- Spracheingabe ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null; let rec=null, recOn=false;
function stopRec(){ if(rec){ try{rec.stop()}catch(e){} } recOn=false; const b=document.getElementById('mic'); if(b) b.classList.remove('on'); }
function micHint(msg,warn){ const h=document.getElementById('micHint'); if(h){ h.textContent=msg; h.classList.toggle('warn',!!warn);} }
function toggleMic(){
  const ta=document.getElementById('answer');
  if(recOn){ stopRec(); return; }
  if(!SR){ micHint('Spracheingabe ist in dieser Ansicht nicht verfügbar. Tippe ins Antwortfeld und nutze das Mikrofon deiner Handy-Tastatur zum Diktieren.',true); ta.focus(); return; }
  try{
    if(synth) synth.cancel();
    rec=new SR(); rec.lang='de-DE'; rec.interimResults=true; rec.continuous=true;
    const base=ta.value?ta.value.trim()+' ':'';
    rec.onresult=e=>{ let t=''; for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript; ta.value=base+t; };
    rec.onerror=e=>{ stopRec(); if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture') micHint('Das Mikrofon ist hier blockiert. Tippe ins Antwortfeld und nutze das Mikrofon deiner Handy-Tastatur zum Diktieren.',true); else if(e.error!=='aborted' && e.error!=='no-speech') micHint('Spracheingabe abgebrochen. Tippe nochmal auf das Mikrofon.',true); };
    rec.onend=()=>{ recOn=false; const b=document.getElementById('mic'); if(b) b.classList.remove('on'); };
    rec.start(); recOn=true; document.getElementById('mic').classList.add('on'); micHint('Ich höre zu … tippe auf das Mikrofon, wenn du fertig bist.');
  }catch(e){ stopRec(); micHint('Spracheingabe konnte nicht starten. Nutze das Mikrofon deiner Handy-Tastatur.',true); }
}

const FB_VER='10.12.2';
const FB={app:null,auth:null,db:null,user:null,loading:null,authReady:null};
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.async=true; s.onload=res; s.onerror=()=>rej(new Error('load')); document.head.appendChild(s); }); }
function fbConfigured(){ const c=window.FIREBASE_CONFIG; return !!(c&&c.apiKey&&!/DEIN|YOUR/.test(c.apiKey)&&c.databaseURL); }
async function loadFirebase(){
  if(FB.loading) return FB.loading;
  FB.loading=(async()=>{
    const b='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    await loadScript(b+'firebase-app-compat.js');
    await Promise.all([loadScript(b+'firebase-auth-compat.js'),loadScript(b+'firebase-database-compat.js')]);
    FB.app=firebase.initializeApp(window.FIREBASE_CONFIG);
    FB.auth=firebase.auth(); FB.db=firebase.database();
    FB.authReady=new Promise(res=>{ const off=FB.auth.onAuthStateChanged(u=>{ FB.user=u; res(u); }); });
    FB.auth.onAuthStateChanged(u=>{ FB.user=u; });
    await FB.authReady;
  })();
  FB.loading.catch(()=>{ FB.loading=null; });
  return FB.loading;
}

/* Raum-Adapter: bildet die Lobby und Duell-Räume auf die Realtime Database ab */
function fbRoom(path){
  const uid=FB.user.uid; const ref=FB.db.ref(path); const mine=ref.child(uid);
  let peers=Object.freeze([]); const hs=new Set(), es=new Set(); let cur={}, disc=false, alive=true;
  const cb=s=>{ const v=s.val()||{}; peers=Object.freeze(Object.keys(v).map(k=>Object.freeze({peer:k,by:k,isMe:k===uid,sameTab:k===uid,kind:'viewer',guest:false,presence:v[k]||{},updatedAt:0}))); hs.forEach(h=>{ try{h({peers})}catch(e){console.error(e)} }); };
  ref.on('value',cb,()=>{ es.forEach(e=>e({code:'upstream_error',message:'Verbindung verloren'})); });
  return {
    name:path,
    peers:()=>peers,
    onPeers(h,e){ hs.add(h); if(e) es.add(e); setTimeout(()=>{ if(alive&&hs.has(h)) h({peers}); },0); return ()=>{ hs.delete(h); if(e) es.delete(e); }; },
    presence(patch){
      if(!alive) return Promise.resolve();
      const n={...cur}; for(const k in patch){ if(patch[k]===null||patch[k]===undefined) delete n[k]; else n[k]=JSON.parse(JSON.stringify(patch[k])); }
      cur=n; if(!disc){ disc=true; mine.onDisconnect().remove(); }
      return mine.set(cur);
    },
    leave(){ alive=false; ref.off('value',cb); hs.clear(); es.clear(); mine.onDisconnect().cancel(); return mine.remove(); },
    join(name){ return Promise.resolve(fbRoom('rooms/'+name)); },
    connected:()=>true
  };
}

}
function solutionHTML(items,keys,hits){
  return items.map(s=>{const it=parseItem(s); return it.note?`<li class="note">${esc(it.text)}</li>`:`<li>${it.label?`<b>${highlight(it.label,keys,hits)}:</b> `:''}${highlight(it.text,keys,hits)}</li>`}).join('');
}
function showResult(answer,dunno){
  stopRec(); if(synth) synth.cancel(); S.phase='result';
  const m=S.queue[S.qi]; const fs=fieldsFor(m); const fk=fs[S.fi];
  const g=dunno?{...grade(m[fk],''),pct:0}:grade(m[fk],answer);
  S.results[m.id][fk]=g;
  const keys=new Set(g.keys);
  const vc=dunno?'bad':cls(g.pct); const verdict=dunno?'Hier ist die Lösung':(g.pct>=0.8?'Stark!':g.pct>=0.5?'Teilweise richtig':g.pct>0?'Ausbaufähig':'Noch nicht');
  const lastField=S.fi===fs.length-1, lastMuscle=S.qi===S.queue.length-1;
  const nextLabel=!lastField?`Weiter: ${FIELD[fs[S.fi+1]].label}`:(lastMuscle?'Ergebnis ansehen':'Nächster Muskel');
  view.innerHTML=`<div class="stack">${headHTML(m)}
  <section class="card">
    <div class="verdict v-${vc}"><span class="vicon">${IC[vc==='good'?'ok':vc]}</span><div><b>${verdict}</b><span>${dunno?esc(FIELD[fk].label):`${g.hits.size} von ${g.keys.length} Fachbegriffen genannt`}</span></div></div>
    ${answer?`<p class="yours">${esc(answer)}</p>`:''}
    <h3 class="sectionhead">Lösung · ${esc(FIELD[fk].label)}</h3>
    <ul class="sol">${solutionHTML(m[fk],keys,g.hits)}</ul>
    ${dunno?'':`<div class="legend"><span><i style="background:var(--ok)"></i>genannt</span><span><i style="background:var(--warn)"></i>gefehlt</span></div>`}
    ${figHTML(m)}
    <div class="explain" id="explain" hidden></div>
    <div class="btnrow">${synth?'<button class="btn tinted small" id="readSol">'+IC.speaker+'Vorlesen</button>':''}${PLATFORM.explain?'<button class="btn tinted small" id="explainBtn">Erklär mir das</button>':''}</div>
  </section>
  <button class="btn primary" id="next">${nextLabel}</button>
  </div>`;
  bindHead(m);
  const box=view.querySelector('#explain');
  const fb=view.querySelector('#figbtn'); if(fb) fb.onclick=()=>fb.closest('.fig').classList.toggle('big');
  const rs=view.querySelector('#readSol'); if(rs) rs.onclick=()=>speak(FIELD[fk].label+'. '+m[fk].map(s=>{const it=parseItem(s);return (it.label?it.label+': ':'')+it.text}).join('. '));
  const eb=view.querySelector('#explainBtn'); if(eb) eb.onclick=()=>explain(m,fk,dunno?'':answer,box);
  view.querySelector('#next').onclick=()=>{ if(synth) synth.cancel();
    if(!lastField){ S.fi++; renderAsk(false); }
    else if(!lastMuscle){ S.qi++; S.fi=0; renderAsk(true); }
    else renderEnd();
  };
  if(dunno&&PLATFORM.explain) explain(m,fk,answer,box);
  else if(!dunno&&autoRead) speak(verdict+'. '+g.hits.size+' von '+g.keys.length+' Begriffen.');
}

/* ---------- Ende ---------- */
function renderEnd(){
  stopRec(); S.phase='end'; setBack('Start',renderStart);
  const done=S.queue.filter(m=>Object.keys(S.results[m.id]||{}).length);
  const rows=done.map(m=>{const r=S.results[m.id]; return `<div class="row"><span class="label">${esc(m.n)}</span><span class="badges">${fieldsFor(m).map(k=>r[k]?`<span class="badge ${cls(r[k].pct)}">${FIELD[k].short} ${Math.round(r[k].pct*100)} %</span>`:'').join('')}</span></div>`}).join('');
  let tot=0,cnt=0; done.forEach(m=>Object.values(S.results[m.id]).forEach(g=>{tot+=g.pct;cnt++;}));
  view.innerHTML=`<div class="stack">
    <div><h1 class="large">Durchgang beendet</h1><p class="sub">${done.length} ${done.length===1?'Muskel':'Muskeln'} abgefragt${cnt?` · im Schnitt ${Math.round(tot/cnt*100)} % der Fachbegriffe`:''}</p></div>
    ${rows?`<section class="group list">${rows}</section>`:''}
    <div class="stack-sm"><button class="btn primary" id="again">Nochmal mit gleicher Auswahl</button><button class="btn plain" id="back">Zur Auswahl</button></div>
  </div>`;
  view.querySelector('#again').onclick=()=>start(selected());
  view.querySelector('#back').onclick=renderStart;
  window.scrollTo({top:0});
}

/* ---------- Vorlese-Schalter ---------- */
const tt=document.getElementById('ttsToggle');
if(!synth){ tt.hidden=true; autoRead=false; }
tt.onclick=()=>{ autoRead=!autoRead; tt.setAttribute('aria-pressed',autoRead); tt.setAttribute('aria-label',autoRead?'Automatisches Vorlesen ist an':'Automatisches Vorlesen ist aus'); if(!autoRead&&synth) synth.cancel(); };

/* ---------- Duell ---------- */
const ROUNDS=10, QTIME=30000, REVEAL=7000, PASS=0.4;
const DUEL={room:null,user:null,ready:false,loading:false,myPeer:null,nick:'',view:'off',outInv:null,decline:null,seen:new Set(),
  named:null,role:null,code:null,unsub:[],timers:[],game:null,hg:null,lastKey:null,myAns:null,roundStart:0,
  tInt:null,deadline:null,rTimer:null,revInt:null,hist:[],oppNick:'',target:null};

/* Bewertung: richtig, wenn genug Fachbegriffe stimmen (Tippfehler werden toleriert, Zahlen und Anteil-Namen zählen weniger) */
function evalAns(items,tx,t){
  const g=grade(items,tx||'');
  const textKeys=new Set(keysFor(items.map(x=>{const it=parseItem(x); return it.note?x:it.text;})));
  let tot=0,hit=0; g.keys.forEach(k=>{const w=(/\d/.test(k)?0.5:1)*(textKeys.has(k)?1:0.3); tot+=w; if(g.hits.has(k)) hit+=w;});
  const ok=!!tx && tot>0 && hit/tot>=PASS;
  const bonus=ok?(t<=10000?2:t<=20000?1:0):0;
  return {tx:(tx||'').slice(0,200),ok,pt:ok?1+bonus:0,bonus,t:Math.min(t,QTIME)};
}
function pickQs(){
  return shuffle(M.slice()).slice(0,ROUNDS).map(m=>{const ks=ORDER.filter(k=>m[k]); return [m.id,ks[Math.floor(Math.random()*ks.length)]];});
}
function newCode(){return String(Math.floor(1000+Math.random()*9000));}
const isHost=()=>DUEL.role==='host';
const curGame=()=>isHost()?DUEL.game:DUEL.hg;
const myNick=()=>(DUEL.nick||'').trim()||'Spieler';
const oppName=()=>DUEL.oppNick||'Gegner';

/* ----- Einstieg ----- */
async function openDuel(){
  if(PLATFORM.ensureAuth && !(await PLATFORM.ensureAuth())) return;
  initLobby();
  renderLobby();
}

/* ----- Lobby ----- */
async function initLobby(){
  if(DUEL.ready||DUEL.loading) return;
  DUEL.loading=true;
  const conn=await PLATFORM.connect().catch(()=>null);
  DUEL.loading=false;
  if(!conn||!conn.room){ DUEL.failed=true; if(DUEL.view==='lobby') renderLobby(); return; }
  DUEL.failed=false; DUEL.ready=true; DUEL.room=conn.room;
  let nm=lsGet('mt-nick'); if(!nm) nm=conn.name||'';
  DUEL.nick=(nm||'').slice(0,24);
  DUEL.room.onPeers(ch=>{ const me=ch.peers.find(p=>p.sameTab); if(me) DUEL.myPeer=me.peer; onLobbyPeers(); },()=>{});
  pushLobby();
  if(DUEL.view==='lobby') renderLobby();
}
function resetLobby(){ DUEL.ready=false; DUEL.failed=false; DUEL.room=null; DUEL.myPeer=null; }
function pushLobby(){
  if(!DUEL.room) return;
  DUEL.room.presence({app:'mt',nick:myNick(),busy:DUEL.view==='game'||DUEL.view==='wait',inv:DUEL.outInv||null,dec:DUEL.decline||null}).catch(()=>{});
}
function lobbyPeers(){ return DUEL.room?DUEL.room.peers().filter(p=>!p.isMe&&p.kind==='viewer'&&p.presence&&p.presence.app==='mt'):[]; }
function onLobbyPeers(){
  const ps=lobbyPeers();
  if(DUEL.view==='wait'&&DUEL.outInv){
    const d=ps.find(p=>p.presence.dec&&p.presence.dec.to===DUEL.myPeer&&p.presence.dec.code===DUEL.outInv.code);
    if(d){ leaveDuel('Deine Herausforderung wurde abgelehnt.'); return; }
  }
  const inc=ps.find(p=>p.presence.inv&&p.presence.inv.to===DUEL.myPeer&&!DUEL.seen.has(p.presence.inv.code));
  showInvite(inc||null);
  if(DUEL.view==='lobby') renderOnline();
}
const inviteBar=document.getElementById('inviteBar');
function showInvite(p){
  if(!p||DUEL.view==='game'||DUEL.view==='wait'){ inviteBar.hidden=true; return; }
  const code=p.presence.inv.code;
  inviteBar.innerHTML=`<div class="sheet-in"><p><b>${esc(p.presence.nick||'Jemand')}</b> fordert dich zum Duell heraus.</p><div class="btnrow"><button class="btn plain" id="invNo">Ablehnen</button><button class="btn primary" id="invYes">Annehmen</button></div></div>`;
  inviteBar.hidden=false;
  inviteBar.querySelector('#invYes').onclick=()=>{ DUEL.seen.add(code); inviteBar.hidden=true; if(synth) synth.cancel(); joinDuel(code); };
  inviteBar.querySelector('#invNo').onclick=()=>{ DUEL.seen.add(code); inviteBar.hidden=true; DUEL.decline={to:p.peer,code}; pushLobby();
    setTimeout(()=>{ if(DUEL.decline&&DUEL.decline.code===code){ DUEL.decline=null; pushLobby(); } },15000); };
}

function renderLobby(msg){
  stopRec(); clearRoundTimers(); S.phase='duel'; DUEL.view='lobby'; pushLobby(); inviteBar.hidden=true;
  setBack('Lernen',()=>{ DUEL.view='off'; pushLobby(); renderStart(); });
  const body=DUEL.room?`
    <section class="stack-sm"><label class="group-label" style="margin:0 0 0 16px" for="nick">Dein Name im Duell</label><input id="nick" class="field" maxlength="24" autocomplete="nickname" placeholder="Name"></section>
    <p class="group-label">Gerade online</p>
    <section class="group list" id="onlineList"></section>
    <p class="group-label">Mit Code spielen</p>
    <section class="card">
      <button class="btn primary" id="mkCode">Duell erstellen</button>
      <div class="coderow"><input id="codeIn" class="field" style="background:var(--fill);box-shadow:none" inputmode="numeric" maxlength="4" placeholder="Code" aria-label="Duell-Code"><button class="btn tinted" id="joinCode">Beitreten</button></div>
    </section>
    ${PLATFORM.accountRow?PLATFORM.accountRow():''}`
  :(DUEL.loading||(!DUEL.ready&&!DUEL.failed)?`<section class="card center"><div class="spinner" aria-hidden="true"></div><p class="sub" style="margin:0">Verbinde …</p></section>`
  :`<section class="card"><p style="margin:0">${PLATFORM.offlineText}</p><button class="btn tinted" id="retry">Erneut versuchen</button></section>`);
  view.innerHTML=`<div class="stack">
    <div><h1 class="large">Duell</h1><p class="sub">10 Runden · gleiche Frage für beide · 30 Sekunden. Richtig gibt 1 Punkt, schnell einloggen bringt Bonus: unter 10 s +2, unter 20 s +1.</p></div>
    ${body}
    <p class="hint" id="lobbyHint" role="status"></p>
  </div>`;
  if(msg) setLobbyHint(msg,true);
  const rt=view.querySelector('#retry'); if(rt) rt.onclick=()=>{ DUEL.failed=false; initLobby(); renderLobby(); };
  if(PLATFORM.bindAccount) PLATFORM.bindAccount();
  if(!DUEL.room) return;
  const ni=view.querySelector('#nick'); ni.value=DUEL.nick;
  let nt=null; ni.oninput=()=>{ DUEL.nick=ni.value.slice(0,24); lsSet('mt-nick',DUEL.nick); clearTimeout(nt); nt=setTimeout(pushLobby,500); };
  view.querySelector('#mkCode').onclick=()=>hostDuel(newCode(),null);
  const ci=view.querySelector('#codeIn');
  const go=()=>{ const c=ci.value.replace(/\D/g,''); if(c.length!==4){ setLobbyHint('Der Code hat 4 Ziffern.',true); return; } joinDuel(c); };
  view.querySelector('#joinCode').onclick=go; ci.onkeydown=e=>{ if(e.key==='Enter') go(); };
  renderOnline();
  onLobbyPeers();
}
function setLobbyHint(t,warn){ const h=document.getElementById('lobbyHint'); if(h){ h.textContent=t; h.classList.toggle('warn',!!warn);} }
function renderOnline(){
  const box=document.getElementById('onlineList'); if(!box) return;
  const ps=lobbyPeers();
  if(!ps.length){ box.innerHTML=`<div class="row"><span class="label"><span>Gerade ist niemand außer dir online.</span><small>${PLATFORM.shareHint}</small></span></div>`; return; }
  const seen=new Set();
  box.innerHTML=ps.filter(p=>{ const k=p.by||p.peer; if(seen.has(k)) return false; seen.add(k); return true; }).map(p=>`<div class="row"><i class="online${p.presence.busy?' busy':''}"></i><span class="label"><span>${esc(p.presence.nick||'Spieler')}</span><small>${p.presence.busy?'im Duell':'bereit'}</small></span><button class="btn tinted small" data-ch="${esc(p.peer)}" ${p.presence.busy?'disabled':''}>Herausfordern</button></div>`).join('');
  box.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ const p=lobbyPeers().find(x=>x.peer===b.dataset.ch); if(p) hostDuel(newCode(),p); });
}

/* ----- Duell-Raum ----- */
async function hostDuel(code,target){
  DUEL.role='host'; DUEL.code=code; DUEL.view='wait';
  DUEL.outInv=target?{to:target.peer,code}:null; DUEL.target=target?(target.presence.nick||'Spieler'):null;
  pushLobby(); renderWait(); await enterRoom(code);
}
async function joinDuel(code){
  DUEL.role='guest'; DUEL.code=code; DUEL.view='wait'; DUEL.outInv=null; DUEL.target=null;
  pushLobby(); renderWait(); await enterRoom(code);
}
async function enterRoom(code){
  let r;
  try{ r=await DUEL.room.join('duel-'+code); }
  catch(e){ leaveDuel('Dem Duell konnte nicht beigetreten werden. Versuch es gleich nochmal.'); return; }
  if(DUEL.view!=='wait'||DUEL.code!==code){ r.leave().catch(()=>{}); return; }
  DUEL.named=r;
  DUEL.unsub.push(r.onPeers(()=>onDuelPeers(),()=>{ if(DUEL.named===r) leaveDuel('Die Verbindung zum Duell ist abgebrochen.'); }));
  r.presence({role:DUEL.role,nick:myNick()}).catch(()=>{});
  if(DUEL.role==='guest') DUEL.timers.push(setTimeout(()=>{ if(DUEL.named===r&&!hostPeer()) leaveDuel('Kein offenes Duell mit diesem Code gefunden.'); },9000));
}
function roomPeers(){ return DUEL.named?DUEL.named.peers():[]; }
function hostPeer(){ return roomPeers().find(p=>!p.isMe&&p.presence&&p.presence.role==='host'); }
function oppPeer(){ if(isHost()){ const g=DUEL.game; return g?roomPeers().find(p=>p.peer===g.op):null; } return hostPeer(); }
function myRoomPeer(){ const me=roomPeers().find(p=>p.sameTab); return me?me.peer:DUEL.myPeer; }

function onDuelPeers(){
  if(!DUEL.named) return;
  if(isHost()){
    const g=DUEL.game;
    if(!g){ const gp=roomPeers().find(p=>!p.isMe&&p.presence&&p.presence.role==='guest'); if(gp) startGame(gp.peer); return; }
    const opp=oppPeer();
    if(!opp){ if(g.ph!=='end') leaveDuel('Dein Gegner hat das Duell verlassen.'); return; }
    DUEL.oppNick=opp.presence.nick||'Gegner';
    hostCheck(); renderOppStatus();
  } else {
    const h=hostPeer();
    if(!h){ if(DUEL.hg&&DUEL.hg.ph!=='end') leaveDuel('Dein Gegner hat das Duell verlassen.'); return; }
    DUEL.oppNick=h.presence.nick||'Gegner';
    const g=h.presence.g;
    if(!g){ const s=document.getElementById('waitSub'); if(s) s.textContent='Verbunden. Gleich geht es los …'; return; }
    if(g.op!==myRoomPeer()){ leaveDuel('Dieses Duell läuft schon mit jemand anderem.'); return; }
    guestState(g);
  }
}

/* Host steuert den Ablauf */
function startGame(op){
  DUEL.outInv=null;
  DUEL.game={id:Math.random().toString(36).slice(2,8),qs:pickQs(),r:0,ph:'q',op,sc:[0,0]};
  DUEL.hist=[]; DUEL.view='game'; pushLobby();
  const opp=oppPeer(); DUEL.oppNick=(opp&&opp.presence.nick)||'Gegner';
  pushHost(); beginRound();
}
function pushHost(){ if(DUEL.named) DUEL.named.presence({role:'host',nick:myNick(),g:DUEL.game}).catch(()=>{}); }
function beginRound(){ startRoundUI(DUEL.game); DUEL.deadline=setTimeout(hostReveal,QTIME+3000); }
function hostCheck(){
  const g=DUEL.game; if(!g||g.ph!=='q') return;
  const opp=oppPeer(); const oa=opp&&opp.presence.a;
  const oLocked=oa&&oa.g===g.id&&oa.r===g.r&&oa.lk;
  if(DUEL.myAns&&oLocked) hostReveal();
}
function hostReveal(){
  const g=DUEL.game; if(!g||g.ph!=='q') return;
  clearRoundTimers(); stopRec();
  if(!DUEL.myAns){ const ta=document.getElementById('answer'); DUEL.myAns={g:g.id,r:g.r,tx:(ta?ta.value:'').trim().slice(0,300),t:QTIME,lk:true}; }
  const opp=oppPeer(); let oa=opp&&opp.presence.a;
  if(!(oa&&oa.g===g.id&&oa.r===g.r)) oa={tx:'',t:QTIME};
  const [mid,fk]=g.qs[g.r]; const items=M[mid][fk];
  const h=evalAns(items,DUEL.myAns.tx,DUEL.myAns.t), o=evalAns(items,String(oa.tx||'').slice(0,300),Number(oa.t)||QTIME);
  g.sc=[g.sc[0]+h.pt,g.sc[1]+o.pt]; g.ph='rev'; g.res={h,o};
  pushHost(); showReveal(g);
  DUEL.rTimer=setTimeout(()=>{
    if(DUEL.game!==g) return;
    delete g.res;
    if(g.r+1>=ROUNDS){ g.ph='end'; pushHost(); showEnd(g); }
    else { g.r++; g.ph='q'; pushHost(); beginRound(); }
  },REVEAL);
}

/* Gast folgt dem Host */
function guestState(g){
  const prev=DUEL.hg; DUEL.hg=g;
  const key=g.id+':'+g.r+':'+g.ph;
  if(key===DUEL.lastKey){ renderOppStatus(); return; }
  DUEL.lastKey=key;
  if(!prev||prev.id!==g.id) DUEL.hist=[];
  if(g.ph==='q'){ DUEL.view='game'; pushLobby(); startRoundUI(g); }
  else if(g.ph==='rev'&&g.res){ clearRoundTimers(); stopRec(); showReveal(g); }
  else if(g.ph==='end'){ clearRoundTimers(); showEnd(g); }
}

/* ----- Anzeige ----- */
function scores(g){ return isHost()?[g.sc[0],g.sc[1]]:[g.sc[1],g.sc[0]]; }
function scoreHTML(g){
  const [a,b]=scores(g);
  return `<div class="score"><div class="sc me"><small>Du</small><b>${a}</b></div><div class="sc mid">Runde ${Math.min(g.r+1,ROUNDS)} von ${ROUNDS}</div><div class="sc op"><small>${esc(oppName())}</small><b>${b}</b></div></div>`;
}
function renderWait(){
  stopRec(); clearRoundTimers(); inviteBar.hidden=true;
  setBack('Abbrechen',()=>leaveDuel());
  const host=isHost();
  view.innerHTML=`<div class="stack">
    <section class="card center" style="padding-block:28px">
      ${host&&!DUEL.target?`<p class="sectionhead">Dein Duell-Code</p><div class="codebig">${esc(DUEL.code)}</div><p class="sub" style="margin:0">Schick den Code deinem Freund. Er tippt im Duell auf „Beitreten“ und gibt ihn ein.</p>`:''}
      ${host&&DUEL.target?`<p class="sectionhead">Herausforderung gesendet</p><p style="margin:0">Warte, bis <b>${esc(DUEL.target)}</b> annimmt …</p>`:''}
      ${!host?`<p class="sectionhead">Duell ${esc(DUEL.code)}</p><p style="margin:0" id="waitSub">Verbinde …</p>`:''}
      <div class="spinner" aria-hidden="true"></div>
    </section>
    <button class="btn plain" id="cancel">Abbrechen</button>
  </div>`;
  view.querySelector('#cancel').onclick=()=>leaveDuel();
}
function startRoundUI(g){
  clearRoundTimers(); stopRec();
  setBack('Aufgeben',()=>leaveDuel());
  const [mid,fk]=g.qs[g.r]; const m=M[mid];
  DUEL.myAns=null; DUEL.roundStart=performance.now();
  view.innerHTML=`<div class="stack">${scoreHTML(g)}
    <div class="tbar" aria-hidden="true"><span id="tfill"></span></div>
    <article class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="pill">${esc(FIELD[fk].label)}</span><span class="count"><span id="tleft">30</span> s</span></div>
      <h2 class="title-xl">${nameHTML(m.n)}</h2>${m.h?`<p class="sub" style="margin:0">${esc(m.h)}</p>`:''}
    </article>
    <section class="stack-sm">
      <p class="question">${esc(FIELD[fk].q)}</p>
      <div class="answerbox">
        <label for="answer" class="srlabel">Deine Antwort</label>
        <textarea id="answer" maxlength="300" placeholder="Sprich oder tippe deine Antwort"></textarea>
        <button class="mic" id="mic" aria-label="Antwort einsprechen">${IC.mic}</button>
      </div>
      <p class="hint" id="micHint"></p>
    </section>
    <button class="btn primary" id="lock">Antwort einloggen</button>
    <p class="opp" id="oppStat"><i></i>${esc(oppName())} denkt nach …</p>
  </div>`;
  view.querySelector('#mic').onclick=toggleMic;
  view.querySelector('#lock').onclick=()=>lockAnswer();
  window.scrollTo({top:0});
  if(autoRead) speak(m.n+'. '+FIELD[fk].label+'?');
  const fill=document.getElementById('tfill'), left=document.getElementById('tleft');
  DUEL.tInt=setInterval(()=>{
    const el=performance.now()-DUEL.roundStart, rest=Math.max(0,QTIME-el);
    if(fill){ fill.style.width=(rest/QTIME*100)+'%'; fill.classList.toggle('low',rest<8000); }
    if(left) left.textContent=Math.ceil(rest/1000);
    if(rest<=0){ clearInterval(DUEL.tInt); DUEL.tInt=null; if(!DUEL.myAns) lockAnswer(); }
  },200);
  renderOppStatus();
}
function lockAnswer(){
  const g=curGame(); if(!g||g.ph!=='q'||DUEL.myAns) return;
  stopRec();
  const ta=document.getElementById('answer');
  const tx=(ta?ta.value:'').trim().slice(0,300);
  const t=Math.min(Math.round(performance.now()-DUEL.roundStart),QTIME);
  DUEL.myAns={g:g.id,r:g.r,tx,t,lk:true};
  if(DUEL.named) DUEL.named.presence({a:DUEL.myAns}).catch(()=>{});
  if(ta) ta.disabled=true;
  const mic=document.getElementById('mic'); if(mic) mic.disabled=true;
  const b=document.getElementById('lock'); if(b){ b.disabled=true; b.textContent=`Eingeloggt nach ${(t/1000).toFixed(1).replace('.',',')} s`; }
  const h=document.getElementById('micHint'); if(h){ h.classList.remove('warn'); h.textContent=tx?'':'Keine Antwort abgegeben.'; }
  if(isHost()) hostCheck();
}
function renderOppStatus(){
  const el=document.getElementById('oppStat'); const g=curGame(); if(!el||!g||g.ph!=='q') return;
  const o=oppPeer(); const a=o&&o.presence.a;
  const locked=a&&a.g===g.id&&a.r===g.r&&a.lk;
  el.innerHTML=locked?`<i class="done"></i>${esc(oppName())} hat eingeloggt`:`<i></i>${esc(oppName())} denkt nach …`;
}
function verdictHTML(label,r){
  return `<div class="pv ${r.ok?'ok':'no'}"><div class="pvh"><small>${esc(label)}</small><b>${r.ok?'Richtig':'Falsch'}</b><span>${r.ok?`+${r.pt}${r.bonus?` (inkl. ${r.bonus} Bonus)`:''}`:'+0'}</span></div><p>${r.tx?esc(r.tx):'<em>keine Antwort</em>'}</p><small class="tm">${(r.t/1000).toFixed(1).replace('.',',')} s</small></div>`;
}
function showReveal(g){
  const [mid,fk]=g.qs[g.r]; const m=M[mid];
  const mine=isHost()?g.res.h:g.res.o, theirs=isHost()?g.res.o:g.res.h;
  if(!DUEL.hist.some(h=>h.r===g.r)) DUEL.hist.push({r:g.r,mid,fk,me:mine,op:theirs});
  const gr=grade(m[fk],mine.tx); const keys=new Set(gr.keys);
  const last=g.r+1>=ROUNDS;
  view.innerHTML=`<div class="stack">${scoreHTML(g)}
    <section class="card">
      <span class="pill">${esc(FIELD[fk].label)}</span>
      <h2 class="title-xl">${nameHTML(m.n)}</h2>
      <div class="duo">${verdictHTML('Du',mine)}${verdictHTML(oppName(),theirs)}</div>
      <h3 class="sectionhead">Lösung</h3>
      <ul class="sol">${solutionHTML(m[fk],keys,gr.hits)}</ul>
      ${figHTML(m)}
    </section>
    <p class="footnote" id="nextIn">${last?'Gleich kommt die Auswertung …':'Nächste Runde gleich …'}</p>
  </div>`;
  const fb=view.querySelector('#figbtn'); if(fb) fb.onclick=()=>fb.closest('.fig').classList.toggle('big');
  window.scrollTo({top:0});
  const t0=performance.now(); const ni=document.getElementById('nextIn');
  DUEL.revInt=setInterval(()=>{ const s=Math.max(0,Math.ceil((REVEAL-(performance.now()-t0))/1000)); if(ni) ni.textContent=(last?'Auswertung in ':'Nächste Runde in ')+s+' s'; },250);
  if(autoRead) speak((mine.ok?'Richtig':'Falsch')+'. '+oppName()+(theirs.ok?' richtig':' falsch')+'.');
}
function showEnd(g){
  clearRoundTimers(); stopRec(); DUEL.view='game';
  setBack('Lobby',()=>leaveDuel());
  const [a,b]=scores(g);
  const head=a>b?'Gewonnen!':a<b?'Verloren':'Unentschieden';
  const rows=DUEL.hist.sort((x,y)=>x.r-y.r).map(h=>`<div class="row"><span class="label"><span>${esc(M[h.mid].n)}</span><small>${esc(FIELD[h.fk].label)}</small></span><span class="badges"><span class="badge ${h.me.ok?'good':'bad'}">Du +${h.me.pt}</span><span class="badge ${h.op.ok?'good':'bad'}">${esc(oppName())} +${h.op.pt}</span></span></div>`).join('');
  view.innerHTML=`<div class="stack">
    <div class="center" style="display:flex;flex-direction:column;gap:6px"><h1 class="large" style="${a>b?'color:var(--accent)':''}">${head}</h1><p class="sub" style="font-size:20px;font-variant-numeric:tabular-nums">Du ${a} : ${b} ${esc(oppName())}</p></div>
    <section class="group list">${rows}</section>
    <div class="stack-sm">${isHost()?'<button class="btn primary" id="again">Revanche</button>':'<p class="footnote">Revanche? Dein Gegner kann eine neue Runde starten. Bleib einfach hier.</p>'}<button class="btn plain" id="leave">Duell verlassen</button></div>
  </div>`;
  const ag=view.querySelector('#again'); if(ag) ag.onclick=()=>{ const opp=oppPeer(); if(opp) startGame(opp.peer); else leaveDuel('Dein Gegner ist nicht mehr da.'); };
  view.querySelector('#leave').onclick=()=>leaveDuel();
  window.scrollTo({top:0});
  if(autoRead) speak(head+'. '+a+' zu '+b+'.');
}
function clearRoundTimers(){
  clearInterval(DUEL.tInt); DUEL.tInt=null; clearTimeout(DUEL.deadline); DUEL.deadline=null; clearInterval(DUEL.revInt); DUEL.revInt=null;
}
function leaveDuel(msg){
  clearRoundTimers(); clearTimeout(DUEL.rTimer); DUEL.rTimer=null;
  DUEL.timers.forEach(clearTimeout); DUEL.timers=[];
  DUEL.unsub.forEach(u=>{try{u()}catch(e){}}); DUEL.unsub=[];
  const r=DUEL.named; DUEL.named=null; if(r) r.leave().catch(()=>{});
  DUEL.game=null; DUEL.hg=null; DUEL.lastKey=null; DUEL.myAns=null; DUEL.outInv=null; DUEL.role=null; DUEL.code=null; DUEL.target=null;
  if(synth) synth.cancel();
  renderLobby(msg);
}

renderStart();
</script>
</body>
</html>
